<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 716" width="960" height="716">
  <defs>
    <style>
      .bg { fill: #FAF9F6; }
      .group-box { fill: #FFFFFF; stroke: #D6D3CD; stroke-width: 1.5; rx: 16; }
      .group-box-accent { fill: #F2F6FC; stroke: #B8CBE8; stroke-width: 1.5; rx: 16; }
      .card { fill: #F5F4F0; stroke: #D8D5CE; stroke-width: 1.2; rx: 12; }
      .card-blue { fill: #E6F0FA; stroke: #7BA7D7; stroke-width: 1.4; rx: 12; }
      .card-warm { fill: #F9F1E6; stroke: #D9B78A; stroke-width: 1.3; rx: 12; }
      .card-green { fill: #EBF5EE; stroke: #8ABFA0; stroke-width: 1.3; rx: 12; }
      .title { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 16px; font-weight: 600; fill: #1F2328; }
      .group-title { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 14px; font-weight: 600; fill: #4A5568; }
      .card-title { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 14px; font-weight: 600; fill: #1F2328; }
      .card-sub { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12px; font-weight: 400; fill: #57606A; }
      .edge-label { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12px; font-weight: 500; fill: #3B434B; }
      .pill { fill: #EFECE6; stroke: #D0CCC4; stroke-width: 1; rx: 10; }
      .arrow { fill: none; stroke: #4A5568; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-head); }
      .arrow-dashed { fill: none; stroke: #5C6BC0; stroke-width: 1.5; stroke-dasharray: 5 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-head-blue); }
    </style>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#4A5568" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-head-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#5C6BC0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="716" rx="18"/>

  <!-- The host submits root requests or sends input to an existing Turn. -->
  <rect class="group-box" x="36" y="28" width="888" height="190" rx="16"/>
  <text class="group-title" x="58" y="52">宿主入口与环境事件</text>
  <rect class="card" x="58" y="64" width="380" height="44" rx="10"/>
  <text class="card-title" x="248" y="83" text-anchor="middle">环境事件与后台通知</text>
  <text class="card-sub" x="248" y="101" text-anchor="middle">工作区变化 · 进程结束 · 子任务待答</text>
  <rect class="card" x="522" y="64" width="380" height="44" rx="10"/>
  <text class="card-title" x="712" y="83" text-anchor="middle">宿主入口</text>
  <text class="card-sub" x="712" y="101" text-anchor="middle">桌面前端 · 终端 · SDK</text>

  <path class="arrow" d="M185 109 V158"/>
  <text class="edge-label" x="198" y="137">定向事件或订阅通知</text>
  <path class="arrow" d="M579 109 V137 H376 V158"/>
  <text class="edge-label" x="474" y="130" text-anchor="middle">追加输入与问题答复</text>
  <path class="arrow" d="M765 109 V158"/>
  <text class="edge-label" x="778" y="137">新任务请求</text>

  <rect class="card-blue" x="58" y="163" width="380" height="43" rx="10"/>
  <text class="card-title" x="248" y="182" text-anchor="middle">当前 Turn 的收件箱</text>
  <text class="card-sub" x="248" y="199" text-anchor="middle">接收已受理的输入与事件，按条件唤醒等待</text>
  <rect class="card-warm" x="522" y="163" width="380" height="43" rx="10"/>
  <text class="card-title" x="712" y="182" text-anchor="middle">Agent 调度入口</text>
  <text class="card-sub" x="712" y="199" text-anchor="middle">新任务排队，由调度器启动独立的 Turn</text>

  <g transform="translate(0 96)">
  <line class="arrow" x1="250" y1="122" x2="250" y2="168"/>
  <rect class="pill" x="154" y="135" width="192" height="22" rx="11"/>
  <text class="edge-label" x="250" y="150" text-anchor="middle">阶段边界按固定批次更新语境</text>
  <line class="arrow" x1="710" y1="122" x2="710" y2="168"/>
  <rect class="pill" x="630" y="135" width="160" height="22" rx="11"/>
  <text class="edge-label" x="710" y="150" text-anchor="middle">启动 Turn，进入循环</text>

  <!-- Middle Left: Constructive Context -->
  <rect class="group-box-accent" x="36" y="174" width="424" height="228" rx="16"/>
  <text class="group-title" x="58" y="202">构造式语境 (Context 三槽装配)</text>

  <rect class="card-blue" x="58" y="216" width="380" height="50" rx="10"/>
  <text class="card-title" x="76" y="238">Background · 背景槽</text>
  <text class="card-sub" x="76" y="256">身份约定 · 当日会话历史与话题图 · 个人规约与长期记忆目录</text>

  <rect class="card-blue" x="58" y="278" width="380" height="50" rx="10"/>
  <text class="card-title" x="76" y="300">Trace · 轨迹槽</text>
  <text class="card-sub" x="76" y="318">按观察顺序记录本轮输入、选域意图、动作调用与执行反馈</text>

  <rect class="card-blue" x="58" y="340" width="380" height="50" rx="10"/>
  <text class="card-title" x="76" y="362">Working · 工作槽</text>
  <text class="card-sub" x="76" y="380">当前计划与待办 · 工作区资源清单与状态 · 后台任务与外部连接</text>

  <!-- Middle Right: 3-Phase Cycle -->
  <rect class="group-box-accent" x="500" y="174" width="424" height="228" rx="16"/>
  <text class="group-title" x="522" y="202">三阶段执行循环 (Agent Cycle)</text>

  <rect class="card" x="522" y="216" width="380" height="50" rx="10"/>
  <text class="card-title" x="540" y="238">Phase 1 · 整理语境与选择行动域</text>
  <text class="card-sub" x="540" y="256">更新计划、按需载入或移出背景，选择一个或多个行动域</text>

  <rect class="card-blue" x="522" y="278" width="380" height="50" rx="10"/>
  <text class="card-title" x="540" y="300">Phase 2 · 挂载 Skill 与生成具体动作</text>
  <text class="card-sub" x="540" y="318">动态挂载所选领域的 Skill 指导与具体工具，生成结构化动作请求</text>

  <rect class="card" x="522" y="340" width="380" height="50" rx="10"/>
  <text class="card-title" x="540" y="362">Phase 3 · 批次执行与反馈沉淀</text>
  <text class="card-sub" x="540" y="380">执行选定动作（含 Search、Inspect），记录结果与后台状态</text>

  <!-- Bidirectional arrows between Context and Cycle -->
  <line class="arrow" x1="460" y1="265" x2="494" y2="265"/>
  <line class="arrow" x1="494" y1="335" x2="460" y2="335"/>

  <!-- Connectors to Bottom Row -->
  <line class="arrow" x1="250" y1="402" x2="250" y2="448"/>
  <rect class="pill" x="158" y="415" width="184" height="22" rx="11"/>
  <text class="edge-label" x="250" y="430" text-anchor="middle">Search 检索 · Inspect 续读</text>

  <line class="arrow" x1="710" y1="402" x2="710" y2="448"/>
  <rect class="pill" x="614" y="415" width="192" height="22" rx="11"/>
  <text class="edge-label" x="710" y="430" text-anchor="middle">日常读写 · 跨日 Reflection 沉淀</text>

  <!-- Bottom Row: Domain Owners & Lifecycle -->
  <rect class="group-box" x="36" y="454" width="888" height="138" rx="16"/>
  <text class="group-title" x="58" y="482">领域空间与跨日生命周期 (统一引用 ref · 日切归档 · 反思整理)</text>

  <rect class="card-green" x="58" y="496" width="198" height="78" rx="10"/>
  <text class="card-title" x="157" y="520" text-anchor="middle">Workspace · 工作区</text>
  <text class="card-sub" x="157" y="540" text-anchor="middle">当日文件操作与外部同步</text>
  <text class="card-sub" x="157" y="558" text-anchor="middle">按需读取正文 · 跨日归档</text>

  <rect class="card-green" x="274" y="496" width="198" height="78" rx="10"/>
  <text class="card-title" x="373" y="520" text-anchor="middle">Session · 当日会话</text>
  <text class="card-sub" x="373" y="540" text-anchor="middle">保存原始交互与行动事实</text>
  <text class="card-sub" x="373" y="558" text-anchor="middle">带出处的可演化话题线索图</text>

  <rect class="card-warm" x="490" y="496" width="198" height="78" rx="10"/>
  <text class="card-title" x="589" y="520" text-anchor="middle">Memory · 记忆空间</text>
  <text class="card-sub" x="589" y="540" text-anchor="middle">当日活动记忆快速记录</text>
  <text class="card-sub" x="589" y="558" text-anchor="middle">Reflection 整理五类持久文档</text>

  <rect class="card-warm" x="706" y="496" width="198" height="78" rx="10"/>
  <text class="card-title" x="805" y="520" text-anchor="middle">Home · 个人规约</text>
  <text class="card-sub" x="805" y="540" text-anchor="middle">身份约定 · 偏好 · 领域 Skill</text>
  <text class="card-sub" x="805" y="558" text-anchor="middle">试用叠加层经审核合入基线</text>
  </g>
</svg>