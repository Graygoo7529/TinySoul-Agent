[[field]]
path = "llm.tasks.*.prefer_successful_provider_seconds"
surface = "task_chains"
group = "task_chains.recovery"
title = "Successful Provider Preference"
description = "How long a recently successful backup provider remains preferred for a model."
value_kind = "number"
importance = "advanced"

[[field]]
path = "action.llm_action.timeout_seconds"
