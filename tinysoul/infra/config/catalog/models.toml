reference = { collection = "llm.tasks" }

[[field]]
path = "loop.cycle.phase2_task_profile"
surface = "cycle_routing"
group = "cycle_routing.phases"
title = "Phase2 Task Chain"
description = "Task profile used to generate Action calls inside the domains selected by Phase1."
