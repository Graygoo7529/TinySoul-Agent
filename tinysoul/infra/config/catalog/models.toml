description = "Allows the selected adapter to enable or disable sampling for this model."
value_kind = "boolean"
importance = "advanced"

[[field]]
path = "llm.models.*.adapter_options.request_id"
surface = "models"
group = "models.adapter_options"
title = "Request ID"
description = "Optional provider request identifier override."
value_kind = "string"
importance = "advanced"

[[field]]
path = "llm.models.*.adapter_options.user_id"
surface = "models"
group = "models.adapter_options"
title = "User ID"
description = "Optional adapter-specific user identifier."
value_kind = "string"
importance = "advanced"

[[field]]
path = "llm.models.*.request_overrides.temperature"
surface = "models"
group = "models.request_overrides"
title = "Request Temperature"
description = "Overrides the task-chain temperature only when this model is selected."
