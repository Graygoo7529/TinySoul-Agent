[[field]]
path = "config.include"
surface = "infrastructure"
group = "infrastructure.sources"
title = "Configuration Includes"
description = "Project-owned TOML include patterns loaded into the configuration source graph."
value_kind = "string_list"
importance = "advanced"

[[field]]
path = "config.env_file"
surface = "infrastructure"
group = "infrastructure.sources"
title = "Dotenv File"
description = "Project-relative dotenv file loaded for configured credential names."
value_kind = "string"
importance = "advanced"

[[field]]
path = "config.document_sets"
surface = "infrastructure"
group = "infrastructure.sources"
title = "Managed Document Sets"
description = "Process-owned declarations for independent project TOML documents managed by configuration transactions."
value_kind = "object_list"
importance = "advanced"

