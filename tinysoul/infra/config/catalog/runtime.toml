[[surface]]
id = "behavior"
title = "Behavior"
description = "User Turn limits, application input behavior, output projection, and Action defaults."

[[surface]]
id = "reflection"
title = "Reflection"
description = "Business timezone, scheduled reflection, archive, and Reflection Turn behavior."

[[surface]]
id = "infrastructure"
title = "Infrastructure"
description = "External foundational services, project configuration sources, and process-owned settings."

[[surface]]
id = "embedding"
title = "Embedding"
description = "External embedding service used by rebuildable semantic indexes."

[[field_group]]
id = "behavior.application"
surface = "behavior"
title = "Application"
description = "Controls terminal input, command handling, and retained Program outcomes."

[[field_group]]
id = "behavior.output"
surface = "behavior"
title = "Output"
description = "Controls terminal output projection and model-context display limits."

[[field_group]]
id = "behavior.user_turn"
surface = "behavior"
title = "User Turn"
description = "Defines the maximum complete Agent Cycles in one User Turn."

[[field_group]]
id = "reflection.business_day"
surface = "reflection"
title = "Business Day"
description = "Defines business time and the project roots used by daily lifecycle management."

[[field_group]]
id = "reflection.scenarios"
surface = "reflection"
title = "Reflection Turn"
description = "Defines the execution boundary for Home and Memory reflection work."

[[field_group]]
id = "reflection.schedule"
surface = "reflection"
title = "Schedule"
description = "Controls whether and when daily reflection work is enqueued."

[[field_group]]
id = "infrastructure.sources"
surface = "infrastructure"
title = "Configuration Sources"
description = "Shows the project TOML includes and dotenv file owned by the process shell."

[[field_group]]
id = "embedding.service"
surface = "embedding"
title = "Embedding Service"
description = "Defines the external endpoint, model, credential, and vector shape."

[[field_group]]
id = "embedding.requests"
surface = "embedding"
title = "Request Limits"
description = "Controls embedding batch size and request timeout."

[[field]]
path = "agent.interactive"
surface = "behavior"
group = "behavior.application"
title = "Interactive Terminal"
description = "Starts the terminal input source when no Endpoint input source is configured."
value_kind = "boolean"

[[field]]
path = "agent.exit_commands"
surface = "behavior"
group = "behavior.application"
title = "Exit Commands"
description = "Terminal command words that request Program exit."
value_kind = "string_list"
importance = "advanced"

[[field]]
path = "agent.stop_turn_commands"
surface = "behavior"
group = "behavior.application"
title = "Stop Turn Commands"
description = "Terminal command words that request cooperative cancellation of the active User Turn."
value_kind = "string_list"
importance = "advanced"

[[field]]
path = "agent.retained_outcomes"
surface = "behavior"
group = "behavior.application"
title = "Retained Outcomes"
description = "Number of completed Program outcomes retained in the process shell."
value_kind = "integer"
importance = "advanced"

[[field]]
path = "agent.output.mode"
surface = "behavior"
group = "behavior.output"
title = "Output Detail"
description = "Default terminal output projection level."
value_kind = "enum"
choices = [
  { value = "normal", label = "Normal" },
  { value = "verbose", label = "Verbose" },
  { value = "model", label = "Model context" },
]

[[field]]
path = "agent.output.model_max_chars"
surface = "behavior"
group = "behavior.output"
title = "Model Output Display Length"
description = "Maximum model-context characters rendered by the terminal output sink."
value_kind = "integer"
importance = "advanced"

[[field]]
path = "loop.user.max_cycles"
surface = "behavior"
group = "behavior.user_turn"
title = "User Turn Cycles"
description = "Maximum complete Agent Cycles allowed in one User Turn."
value_kind = "integer"

[[field]]
path = "reflection.timezone"
surface = "reflection"
group = "reflection.business_day"
title = "Business Timezone"
description = "IANA timezone used to determine business days and reflection schedule time."
value_kind = "string"

[[field]]
path = "reflection.archive_root"
surface = "reflection"
group = "reflection.business_day"
title = "Archive Root"
description = "Project-relative directory containing frozen business-day archives."
value_kind = "string"
importance = "advanced"

[[field]]
path = "reflection.home.max_cycles"
surface = "reflection"
group = "reflection.scenarios"
title = "Home Reflection Cycles"
description = "Maximum complete Agent Cycles allowed in one Home or Memory Reflection Turn."
value_kind = "integer"

[[field]]
path = "reflection.memory.max_cycles"
surface = "reflection"
group = "reflection.scenarios"
title = "Memory Reflection Cycles"
description = "Maximum complete Agent Cycles allowed in one Home or Memory Reflection Turn."
value_kind = "integer"

[[field]]
path = "reflection.schedule.enabled"
surface = "reflection"
group = "reflection.schedule"
title = "Daily Reflection"
description = "Allows the stable scheduler to enqueue daily reflection work."
value_kind = "boolean"

[[field]]
path = "reflection.schedule.daily_time"
surface = "reflection"
group = "reflection.schedule"
title = "Daily Reflection Time"
description = "Local business-time clock value used for scheduled daily reflection."
value_kind = "string"

[[field]]
path = "infra.embedding.enabled"
surface = "embedding"
group = "embedding.service"
title = "Embedding Service"
description = "Enables external embedding generation for semantic Memory search indexes."
value_kind = "boolean"

[[field]]
path = "infra.embedding.base_url"
surface = "embedding"
group = "embedding.service"
title = "Embedding API Base URL"
description = "OpenAI-compatible API root used for embedding requests."
value_kind = "string"

[[field]]
path = "infra.embedding.model"
surface = "embedding"
group = "embedding.service"
title = "Embedding Model"
description = "Provider model identifier used to generate embedding vectors."
value_kind = "string"

[[field]]
path = "infra.embedding.api_key_env"
surface = "embedding"
group = "embedding.service"
title = "Embedding Credential Name"
description = "Dotenv variable that contains the embedding service API key."
value_kind = "string"
credential_reference = true

[[field]]
path = "infra.embedding.dimensions"
surface = "embedding"
group = "embedding.service"
title = "Embedding Dimensions"
description = "Expected vector dimension produced by the configured embedding model."
value_kind = "integer"

[[field]]
path = "infra.embedding.batch_size"
surface = "embedding"
group = "embedding.requests"
title = "Embedding Batch Size"
description = "Maximum number of text inputs included in one embedding request."
value_kind = "integer"
importance = "advanced"

[[field]]
path = "infra.embedding.timeout_seconds"
surface = "embedding"
group = "embedding.requests"
title = "Embedding Timeout"
description = "Maximum time allowed for one embedding API request."
value_kind = "number"
importance = "advanced"

[[field]]
path = "config.include"
surface = "infrastructure"
group = "infrastructure.sources"
title = "Configuration Includes"
description = "Project-owned TOML include patterns loaded into the configuration source graph."
value_kind = "string_list"
importance = "advanced"

[[field]]
path = "config.env_file"
surface = "infrastructure"
group = "infrastructure.sources"
title = "Dotenv File"
description = "Project-relative dotenv file loaded for configured credential names."
value_kind = "string"
importance = "advanced"

[[field]]
path = "config.document_sets"
surface = "infrastructure"
group = "infrastructure.sources"
title = "Managed Document Sets"
description = "Process-owned declarations for independent project TOML documents managed by configuration transactions."
value_kind = "object_list"
importance = "advanced"
