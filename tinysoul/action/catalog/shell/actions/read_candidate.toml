name = "shell.read_candidate"
domain = "shell"

[tool]
description = "Read a bounded UTF-8 slice from one candidate path inside the active Shell Workspace mirror."

[tool.schema]
type = "object"
required = ["execution_id", "path"]
additionalProperties = false

[tool.schema.properties.execution_id]
type = "string"
description = "Turn-scoped Shell execution id."

[tool.schema.properties.path]
type = "string"
description = "Candidate relative path returned by run or wait; it is not a Workspace Link before apply."

[tool.schema.properties.cursor]
type = "integer"
description = "Optional character cursor, default zero."

[tool.schema.properties.max_chars]
type = "integer"
description = "Optional bounded character count."

[semantic]
use_when = ["Need to inspect a Shell candidate before apply or discard"]
avoid_when = ["Candidate metadata is sufficient", "Need to read the active Workspace"]
effects = ["read_only"]
examples = ["Read the start of a candidate file from the Shell mirror"]

[runtime]
parallel_policy = "serial"

[backend]
kind = "supervised_process"
handler = "shell.read_candidate"
