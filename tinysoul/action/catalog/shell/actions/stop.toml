name = "shell.stop"
domain = "shell"

[tool]
description = "Terminate the active running Shell job and retain logs and candidates for inspection or discard."

[tool.schema]
type = "object"
required = ["execution_id"]
additionalProperties = false

[tool.schema.properties.execution_id]
type = "string"
description = "Turn-scoped Shell execution id."

[semantic]
use_when = ["A running Shell job should not continue"]
avoid_when = ["The job completed successfully and should be applied"]
effects = ["modifying"]
examples = ["Stop the current Shell job"]

[runtime]
parallel_policy = "serial"

[backend]
kind = "supervised_process"
handler = "shell.stop"
