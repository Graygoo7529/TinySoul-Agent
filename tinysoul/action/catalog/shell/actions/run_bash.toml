name = "shell.run_bash"
domain = "shell"

[tool]
description = "Start a bounded non-interactive Bash command in a transactional Workspace mirror. This is not an OS security sandbox."

[tool.schema]
type = "object"
required = ["command"]
additionalProperties = false

[tool.schema.properties.command]
type = "string"
description = "Immediate Bash command. It is executed but not echoed in ActionResult."

[tool.schema.properties.working_directory]
type = "string"
description = "Optional existing relative directory inside the Workspace mirror; defaults to '.'."

[semantic]
use_when = ["Need an immediate Bash pipeline and the project explicitly enables Bash"]
avoid_when = ["Another Script or Shell job is unresolved", "A maintained Python or Bash Script is clearer"]
effects = ["modifying"]
examples = ["Run a bounded Bash command in the mirrored Workspace"]

[runtime]
parallel_policy = "serial"

[backend]
kind = "supervised_process"
handler = "shell.run_bash"
