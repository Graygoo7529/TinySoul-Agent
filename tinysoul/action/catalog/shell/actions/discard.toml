name = "shell.discard"
domain = "shell"

[tool]
description = "Delete a non-running Shell job, its mirror, logs, and candidates without changing the active Workspace."

[tool.schema]
type = "object"
required = ["execution_id"]
additionalProperties = false

[tool.schema.properties.execution_id]
type = "string"
description = "Turn-scoped Shell execution id."

[semantic]
use_when = ["A ready, failed, timed out, or stopped Shell job should not be applied"]
avoid_when = ["The job is still running", "Reviewed successful changes should be applied"]
effects = ["modifying"]
examples = ["Discard a failed Shell job after inspecting its logs"]

[runtime]
parallel_policy = "serial"

[backend]
kind = "supervised_process"
handler = "shell.discard"
