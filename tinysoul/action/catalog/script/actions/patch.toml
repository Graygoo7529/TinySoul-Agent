name = "script.patch"
domain = "script"

[tool]
description = "Apply one exact, deterministic text replacement to an existing Workspace or general HOW script after syntax policy validation."

[tool.schema]
type = "object"
required = ["target_link", "old_text", "new_text"]
additionalProperties = false

[tool.schema.properties.target_link]
type = "string"
description = "Existing Workspace or general HOW script link."

[tool.schema.properties.old_text]
type = "string"
description = "Text that must occur exactly once."

[tool.schema.properties.new_text]
type = "string"
description = "Replacement text."

[tool.schema.properties.expected_digest]
type = "string"
description = "Optional current target digest guard."

[semantic]
use_when = ["Need one precise script source edit"]
avoid_when = ["The script needs a broad rewrite"]
effects = ["modifying"]
examples = ["Patch one constant in workspace:scripts/report.py"]

[runtime]
parallel_policy = "serial"

[backend]
kind = "native"
handler = "script.patch"
