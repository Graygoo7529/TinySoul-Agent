name = "script.wait"
domain = "script"

[tool]
description = "Wait for the active Script job to finish, receive a new runtime signal, or reach the requested interval, then return incremental logs and candidate metadata."

[tool.schema]
type = "object"
required = ["execution_id"]
additionalProperties = false

[tool.schema.properties.execution_id]
type = "string"
description = "Turn-scoped Script execution id."

[tool.schema.properties.wait_seconds]
type = "integer"
minimum = 15
default = 15
maximum = 60
description = "Wait interval in seconds; bounded by the effective project configuration."

[semantic]
use_when = ["The current Turn has a running Script job that needs paced supervision"]
avoid_when = ["No Script job is active", "The current job already needs apply or discard"]
effects = ["read_only"]
examples = ["Wait 15 seconds for the current Script job"]

[runtime]
parallel_policy = "serial"

[backend]
kind = "supervised_process"
handler = "script.wait"
