name = "script.stop"
domain = "script"

[tool]
description = "Terminate the active running Script job and retain its logs and candidates for inspection or discard. A stopped job cannot be applied."

[tool.schema]
type = "object"
required = ["execution_id"]
additionalProperties = false

[tool.schema.properties.execution_id]
type = "string"
description = "Turn-scoped Script execution id."

[semantic]
use_when = ["A running Script job should not continue"]
avoid_when = ["The job completed successfully and should be applied"]
effects = ["modifying"]
examples = ["Stop the current Script job after inspecting its progress"]

[runtime]
parallel_policy = "serial"

[backend]
kind = "supervised_process"
handler = "script.stop"
