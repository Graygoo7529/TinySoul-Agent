name = "script.discard"
domain = "script"

[tool]
description = "Delete a non-running Script job, its transactional mirror, logs, and candidates without changing the active Workspace."

[tool.schema]
type = "object"
required = ["execution_id"]
additionalProperties = false

[tool.schema.properties.execution_id]
type = "string"
description = "Turn-scoped Script execution id."

[semantic]
use_when = ["A completed, failed, timed out, or stopped Script job should not be applied"]
avoid_when = ["The job is still running", "Reviewed successful changes should be applied"]
effects = ["modifying"]
examples = ["Discard a failed Script job after inspecting its logs"]

[runtime]
parallel_policy = "serial"

[backend]
kind = "script"
handler = "script.discard"
