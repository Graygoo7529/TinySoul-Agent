name = "memory.search"
domain = "memory"

[tool]
description = "Search bounded long-term Memory metadata by query."
schema = { type = "object", properties = { query = { type = "string" }, top_k = { type = "integer" } }, required = ["query"], additionalProperties = false }

[semantic]
use_when = ["A relevant prior date is not known", "A durable past fact should be located"]
avoid_when = ["The exact memory:YYYY-MM-DD link is already known"]
effects = ["read_only"]
examples = ["Search prior Memory for a lifecycle design decision"]

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[backend]
kind = "native"
handler = "memory.search"
