name = "core.context.inspect"
domain = "core"

[tool]
description = "Inspect a visible Context segment reference, including current Turn trace and prior-Turn Session Map."

[tool.schema]
type = "object"
required = ["ref"]
additionalProperties = false

[tool.schema.properties.ref]
type = "string"
description = "A visible turn:trace ref, session:map entry point, Session Turn or Action occurrence ref."

[tool.schema.properties.continuation]
type = "string"
description = "Opaque continuation returned for unfinished content from this same ref."

[semantic]
use_when = ["A needed decision, Action result or prior-Turn fact is behind a visible Context reference"]
avoid_when = ["The needed fact is already visible"]
effects = ["read_only"]
examples = ["Inspect a visible branch ref, then inspect one returned leaf ref"]

[runtime]
timeout_seconds = 5
parallel_policy = "serial"

[runtime.result]
trace_mode = "foldable"

[backend]
kind = "native"
handler = "context.inspect"
