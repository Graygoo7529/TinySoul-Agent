name = "core.memory.memorize"
domain = "core"

[tool]
description = "Patch today's explicit memory:current using its expected digest. Preserve useful canonical memory:daily/entity/concept/fact/note links that already appear in context so later turns can inspect or recall them."
schema = { type = "object", properties = { expected_digest = { type = "string" }, operations = { type = "array", items = { type = "object", properties = { kind = { type = "string", enum = ["append", "replace", "remove", "clear"] }, text = { type = "string" }, old_text = { type = "string" }, new_text = { type = "string" } }, required = ["kind"], additionalProperties = false } } }, required = ["expected_digest", "operations"], additionalProperties = false }

[semantic]
use_when = ["A preference, decision, open thread, or useful Memory Link should remain explicit across later turns today", "The user explicitly asks to remember or forget something"]
avoid_when = ["Creating or changing daily/entity/concept/fact/note persistent documents", "The information is already represented clearly in current memory"]
effects = ["modifying"]
examples = ["Append a durable decision and include <memory:concept/agent-design> when that known Link is relevant", "Remove a completed temporary reminder"]

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[backend]
kind = "native"
handler = "memory.memorize"
