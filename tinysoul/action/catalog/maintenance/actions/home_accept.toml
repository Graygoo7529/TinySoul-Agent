name = "maintenance.home.accept"
domain = "maintenance"

[tool]
description = "Accept one reviewed runtime Home change into actual Home using its current change token."

[tool.schema]
type = "object"
required = ["token"]
additionalProperties = false

[tool.schema.properties.token]
type = "string"
description = "Current change token returned by maintenance.home.list."

[semantic]
use_when = ["The reviewed runtime change should become actual Home content"]
avoid_when = ["The token is stale or the change has not been inspected"]
effects = ["modifying"]

[backend]
kind = "native"
handler = "maintenance.home.accept"
