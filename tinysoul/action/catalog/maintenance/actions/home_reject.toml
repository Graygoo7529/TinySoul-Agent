name = "maintenance.home.reject"
domain = "maintenance"

[tool]
description = "Reject one inspected runtime change or skill-memory suggestion, keeping actual Home unchanged."

[tool.schema]
type = "object"
required = ["token"]
additionalProperties = false

[tool.schema.properties.token]
type = "string"
description = "Current review token returned by maintenance.home.list."

[semantic]
use_when = ["The runtime change should be discarded or the reviewed HOW needs no update"]
avoid_when = ["The token is stale or the review has not been inspected"]
effects = ["modifying"]

[backend]
kind = "native"
handler = "maintenance.home.reject"
