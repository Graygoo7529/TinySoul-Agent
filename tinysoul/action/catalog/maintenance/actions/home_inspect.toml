name = "maintenance.home.inspect"
domain = "maintenance"

[tool]
description = "Inspect one token-bound Home change and its bounded runtime, actual, and skill-memory review facts."

[tool.schema]
type = "object"
required = ["token"]
additionalProperties = false

[tool.schema.properties.token]
type = "string"
description = "Change token returned by maintenance.home.list."

[semantic]
use_when = ["A listed Home change must be reviewed before resolution"]
avoid_when = ["The current task is Memory Maintenance"]
effects = ["read_only"]

[backend]
kind = "native"
handler = "maintenance.home.inspect"
