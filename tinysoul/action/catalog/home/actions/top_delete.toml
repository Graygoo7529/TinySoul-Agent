name = "home.top.delete"
domain = "home"

[tool]
description = "Tombstone one top-level Agent Home entry in the active overlay."
schema = { type = "object", properties = { link = { type = "string", description = "Stable home:*@ top-level link." }, expected_digest = { type = "string" } }, required = ["link"], additionalProperties = false }

[semantic]
use_when = ["An obsolete top-level WHAT, WHY, HOW, or non-core AGENT entry should leave the effective view"]
avoid_when = ["home:agent@AGENT.md should be deleted", "A long-term Memory should change"]
effects = ["modifying"]
examples = ["Delete an obsolete home:why@old_rule.md entry"]

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[backend]
kind = "native"
handler = "home.top.delete"
