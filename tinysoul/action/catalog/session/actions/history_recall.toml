name = "session.history.recall"
domain = "session"

[tool]
description = "Recall bounded canonical trace evidence for one prior Turn."

[tool.schema]
type = "object"
required = ["ref"]
additionalProperties = false

[tool.schema.properties.ref]
type = "string"
description = "A concrete session:turn ref."

[tool.schema.properties.max_chars]
type = "integer"
description = "Optional maximum recalled character count."

[tool.schema.properties.max_entries]
type = "integer"
description = "Optional maximum complete trace entries returned by this page. Use 1 for an exact index."

[tool.schema.properties.cursor]
type = "object"
description = "Optional continuation cursor returned verbatim by an earlier recall."
additionalProperties = false

[tool.schema.properties.cursor.properties.entry_index]
type = "integer"

[tool.schema.properties.cursor.properties.char_offset]
type = "integer"

[tool.schema.properties.cursor.properties.entry_digest]
type = "string"

[semantic]
use_when = ["Need raw canonical trace entries at a known prior-Turn location"]
avoid_when = ["Need to navigate Session summaries or count Action outcomes"]
effects = ["read_only"]
examples = ["Use an Action trace index with max_entries 1 to recover the exact call or result"]

[runtime]
parallel_policy = "serial"

[runtime.result]
trace_mode = "foldable"

[backend]
kind = "native"
handler = "session.history.recall"
