name = "session.history.recall"
domain = "session"

[tool]
description = "Recall the semantic request and result for one prior-Turn Action ref returned by inspect."

[tool.schema]
type = "object"
required = ["ref"]
additionalProperties = false

[tool.schema.properties.ref]
type = "string"
description = "A concrete session:turn/...#action/... ref returned by session.history.inspect."

[tool.schema.properties.cursor]
type = "object"
description = "Optional continuation cursor returned verbatim by an earlier recall."
additionalProperties = false

[tool.schema.properties.cursor.properties.entry_index]
type = "integer"

[tool.schema.properties.cursor.properties.char_offset]
type = "integer"

[tool.schema.properties.cursor.properties.entry_digest]
type = "string"

[semantic]
use_when = ["Need the request, result, references, or failure facts for one Action leaf returned by inspect"]
avoid_when = ["Need to locate a Turn or Action leaf"]
effects = ["read_only"]
examples = ["Submit one Action ref from inspect without interpreting its suffix"]

[runtime]
parallel_policy = "serial"

[runtime.result]
trace_mode = "foldable"

[backend]
kind = "native"
handler = "session.history.recall"
