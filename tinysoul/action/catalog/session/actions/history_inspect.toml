name = "session.history.inspect"
domain = "session"

[tool]
description = "Explore completed Session history from the active head through Summary, Turn, and Action nodes."

[tool.schema]
type = "object"
additionalProperties = false

[tool.schema.properties.ref]
type = "string"
description = "Optional Session ref returned by Background or an earlier inspect result. Omit it to inspect the active head."

[tool.schema.properties.action]
type = "string"
description = "Optional Action-name filter when ref identifies a Turn Action collection."

[tool.schema.properties.cursor]
type = "object"
description = "Optional continuation cursor returned verbatim by an earlier inspect page."
additionalProperties = false

[tool.schema.properties.cursor.properties.entry_index]
type = "integer"

[tool.schema.properties.cursor.properties.char_offset]
type = "integer"

[tool.schema.properties.cursor.properties.entry_digest]
type = "string"

[tool.schema.properties.cursor.properties.revision]
type = "integer"

[tool.schema.properties.cursor.properties.action]
type = "string"

[semantic]
use_when = ["Need to locate an earlier Turn or progressively expand a Summary, Turn, or Turn Action collection"]
avoid_when = ["Already have a session:turn/...#action/... ref and need its request or result"]
effects = ["read_only"]
examples = ["Inspect the Action collection ref from Session Background, optionally filtering by Action name"]

[runtime]
parallel_policy = "serial"

[runtime.result]
trace_mode = "foldable"

[backend]
kind = "native"
handler = "session.history.inspect"
