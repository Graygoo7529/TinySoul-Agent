name = "workspace.rewrite"
domain = "workspace"

[tool]
description = "Rewrite one bounded UTF-8 workspace text resource through an internal LLM task. The target must be available as a complete prompt source; use digest-guarded workspace.patch calls for truncated, larger, or localized changes. Pass every Workspace source used as reference_links. The action result returns metadata only."

[tool.schema]
type = "object"
required = ["target_link", "instruction"]
additionalProperties = false

[tool.schema.properties.target_link]
type = "string"
description = "Target workspace resource link such as workspace:docs/task.md."

[tool.schema.properties.instruction]
type = "string"
description = "Rewrite instruction for the target resource."

[tool.schema.properties.reference_links]
type = "array"
description = "Exact read-only Workspace links whose content informs the rewrite."

[tool.schema.properties.reference_links.items]
type = "string"
description = "Read-only workspace resource link such as workspace:docs/context.md."

[tool.schema.properties.expected_digest]
type = "string"
description = "Optional current digest from workspace.describe to guard against stale rewrites."

[semantic]
use_when = ["Need an LLM-assisted rewrite of a bounded workspace text resource"]
avoid_when = ["A precise deterministic replacement is enough", "The target content should not be overwritten", "The target or replacement is larger than one bounded write"]
effects = ["modifying"]
examples = ["Rewrite workspace:docs/plan.md using workspace:docs/notes.md as reference"]

[runtime]
timeout_seconds = 240
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[backend]
kind = "llm_action"
handler = "workspace.rewrite"

[backend.options]
max_output_tokens = 16384
max_output_chars = 50000
