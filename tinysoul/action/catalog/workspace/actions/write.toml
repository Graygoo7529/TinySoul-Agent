name = "workspace.write"
domain = "workspace"

[tool]
description = "Generate a bounded UTF-8 text artifact through an internal LLM task and write it to a workspace resource. Pass every Workspace source used as reference_links; split long documents into a first write followed by digest-guarded workspace.patch calls. The action result returns metadata only."

[tool.schema]
type = "object"
required = ["target_link", "instruction"]
additionalProperties = false

[tool.schema.properties.target_link]
type = "string"
description = "Target workspace resource link such as workspace:docs/task.md."

[tool.schema.properties.instruction]
type = "string"
description = "Instruction for generating the complete target resource text."

[tool.schema.properties.reference_links]
type = "array"
description = "Exact read-only Workspace links whose content informs the artifact. Include these instead of relying on summaries or an implicit current file."

[tool.schema.properties.reference_links.items]
type = "string"
description = "Read-only workspace resource link such as workspace:docs/context.md."

[tool.schema.properties.overwrite]
type = "boolean"
description = "Set true to replace an existing file. Existing target content is then loaded inside the action."

[tool.schema.properties.expected_digest]
type = "string"
description = "Optional current digest from workspace.describe to guard against stale overwrites."

[tool.schema.properties.retention]
type = "string"
enum = ["ephemeral", "turn", "day", "persistent"]
description = "Resource lifetime; only ephemeral or turn resources may be auto-trashed under pressure."

[semantic]
use_when = ["Need to create or intentionally replace a bounded workspace text resource with LLM-generated content"]
avoid_when = ["A precise deterministic replacement is enough", "The target content is already fully available as a small literal", "The requested artifact is larger than one bounded write"]
effects = ["modifying"]
examples = ["Generate a plan at workspace:docs/plan.md using workspace:docs/notes.md as reference"]

[runtime]
timeout_seconds = 240
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[backend]
kind = "llm_action"
handler = "workspace.write"

[backend.options]
max_output_tokens = 16384
max_output_chars = 50000
