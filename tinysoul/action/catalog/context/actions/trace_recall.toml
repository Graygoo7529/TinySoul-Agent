name = "context.trace.recall"
domain = "context"

[tool]
description = "Recall a bounded leaf from compressed current-Turn history."

[tool.schema]
type = "object"
required = ["ref"]
additionalProperties = false

[tool.schema.properties.ref]
type = "string"
description = "A leaf turn:trace node reference returned by context.trace.inspect."

[tool.schema.properties.max_chars]
type = "integer"
description = "Optional maximum recalled character count."

[tool.schema.properties.max_entries]
type = "integer"
description = "Optional maximum complete trace entries returned by this page. Use 1 for an exact trace index."

[tool.schema.properties.cursor]
type = "object"
description = "Optional continuation cursor returned verbatim by an earlier recall."
additionalProperties = false

[tool.schema.properties.cursor.properties.entry_index]
type = "integer"

[tool.schema.properties.cursor.properties.char_offset]
type = "integer"

[tool.schema.properties.cursor.properties.entry_digest]
type = "string"

[semantic]
use_when = ["Need original details from a compressed current-Turn interaction"]
avoid_when = ["A branch still needs to be inspected before reaching a leaf"]
effects = ["read_only"]
examples = ["Recall a leaf containing an earlier failed action result"]

[runtime]
parallel_policy = "serial"

[runtime.result]
trace_mode = "foldable"

[backend]
kind = "native"
handler = "context.trace.recall"
