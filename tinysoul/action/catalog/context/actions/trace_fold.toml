name = "context.trace.fold"
domain = "context"

[tool]
description = "Remove current-Turn visible overlays from all foldable trace results."
schema = { type = "object", properties = {}, required = [], additionalProperties = false }

[semantic]
use_when = ["Expanded foldable action details are no longer needed"]
avoid_when = ["The expanded details are still needed for the next decision"]
effects = ["modifying"]
examples = ["Fold expanded trace details after extracting the needed conclusion"]

[runtime]
parallel_policy = "serial"

[backend]
kind = "native"
handler = "context.trace.fold"
