name = "core.answer"
domain = "core"

[tool]
description = "Provide a final user-facing answer."

[tool.schema]
type = "object"
required = ["text"]
additionalProperties = false

[tool.schema.properties.text]
type = "string"
description = "Final answer text."

[tool.schema.properties.references]
type = "array"
description = "Optional source or workspace links used by the answer."

[tool.schema.properties.references.items]
type = "string"

[semantic]
use_when = ["The task is complete and the user should receive an answer"]
avoid_when = ["More actions are required before answering"]
effects = ["read_only"]
examples = ["Answer the user's direct question after gathering enough context"]

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[backend]
kind = "native"
handler = "core.answer"
