[llm.models.minimax-latest]
reasoning_effort = "high"
family = "MiniMax"
collapsed = false
adapter = "minimax"
providers = [
  { provider = "orca", provider_model = "minimax/minimax-m3.1-flash" },
  { provider = "minimax", provider_model = "MiniMax-M3.1-Flash" },
]
context_window_tokens = 1000000
capabilities = [
  "text_input",
  "image_input",
  "image_remote_url",
  "tool_calling",
  "reasoning_output",
]

[llm.models.minimax-latest.adapter_options]
native_replay = "content"
thinking = "adaptive"
choices.thinking = ["adaptive"]
choices.reasoning_effort = ["low", "medium", "high", "xhigh", "max"]
