[llm.models.gpt-sol]
reasoning_effort = "high"
family = "GPT"
collapsed = false
adapter = "gpt"
providers = [
  { provider = "orca", provider_model = "openai/gpt-5.6-sol" },
  { provider = "openai", provider_model = "gpt-5.6-sol" },
  { provider = "wenrugou", provider_model = "gpt-5.6-sol" },
  { provider = "sublyx-proxy", provider_model = "gpt-5.6-sol" },
]
context_window_tokens = 262144
capabilities = [
  "text_input",
  "image_input",
  "image_remote_url",
  "json_object_output",
  "tool_calling",
  "reasoning_output",
  "prompt_cache",
]

[llm.models.gpt-sol.adapter_options]
reasoning_keep = "encrypted"
prompt_cache_mode = "implicit"
prompt_cache_ttl = "30m"
verbosity = "medium"
reasoning_efforts = ["none", "low", "medium", "high", "xhigh", "max"]
reasoning_summary = "auto"

