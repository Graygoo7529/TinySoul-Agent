[llm.models.gpt-astra]
reasoning_effort = "high"
family = "GPT"
collapsed = false
adapter = "gpt"
providers = [
  { provider = "orca", provider_model = "openai/gpt-6-astra" },
  { provider = "openai", provider_model = "gpt-6-astra" },
  { provider = "wenrugou", provider_model = "gpt-6-astra" },
  { provider = "sublyx-proxy", provider_model = "gpt-6-astra" },
]
context_window_tokens = 1050000
capabilities = [
  "text_input",
  "image_input",
  "image_remote_url",
  "json_object_output",
  "tool_calling",
  "reasoning_output",
  "prompt_cache",
]

[llm.models.gpt-astra.adapter_options]
sampling = "omit"
choices.sampling = ["omit"]
native_replay = "encrypted"
prompt_cache_mode = "implicit"
prompt_cache_ttl = "30m"
prompt_cache_boundaries = ["background", "trace"]
verbosity = "medium"
choices.reasoning_effort = ["low", "medium", "high", "xhigh", "max"]
reasoning_summary = "auto"

