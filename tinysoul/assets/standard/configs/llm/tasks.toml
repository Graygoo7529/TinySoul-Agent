[llm.tasks.frame-stage1]
models = ["gpt-terra", "deepseek-flash"]
required_capabilities = ["text_input"]
# Profile defaults only.
# Loop Phase1/Phase2 override:
#   answer_format = "none"
#   tool_use = "required"
answer_format = "json_object"
tool_use = "disabled"
temperature = 0.3
max_output_tokens = 32768
max_retries_per_provider = 1
retry_wait_seconds = 1.0
provider_switch_wait_seconds = 0.0
model_switch_wait_seconds = 2.0
max_cycles = 10
prefer_successful_provider_seconds = 600
prefer_successful_model_seconds = 600

