[llm.models.gpt_5_5]
adapter = "openai"
providers = [
  { provider = "openai", provider_model = "gpt-5.5" },
  { provider = "orca", provider_model = "openai/gpt-5.5" },
  { provider = "wenrugou", provider_model = "gpt-5.5" },
  { provider = "sublyx_proxy", provider_model = "gpt-5.5" },
]
context_window_tokens = 262144
capabilities = [
  "text_input",
  "image_input",
  "image_remote_url",
  "json_object_output",
  "tool_calling",
  "reasoning_output",
  "prompt_cache",
]

[llm.models.gpt_5_5.adapter_options]
reasoning_keep = "encrypted"
prompt_cache_retention = "24h"
verbosity = "medium"
reasoning_effort = "high"
reasoning_summary = "auto"

