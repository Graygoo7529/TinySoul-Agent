[llm.models.deepseek_v4]
adapter = "deepseek"
providers = [{ provider = "deepseek", provider_model = "deepseek-v4-pro" }]
context_window_tokens = 262144
capabilities = [
  "text_input",
  "json_object_output",
  "reasoning_output",
  "tool_calling",
]

[llm.models.deepseek_v4.adapter_options]
thinking = "enabled"
reasoning_effort = "high"
reasoning_keep = "content"
