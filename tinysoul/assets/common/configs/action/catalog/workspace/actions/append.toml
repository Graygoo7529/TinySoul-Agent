name = "workspace.append"
domain = "workspace"

[tool]
description = "Append an exact bounded UTF-8 text fragment to an existing workspace text resource. Use edit for precise replacement."

[tool.schema]
type = "object"
required = ["target_ref", "text"]
additionalProperties = false

[tool.schema.properties.target_ref]
type = "string"
description = "Existing workspace text resource ref."

[tool.schema.properties.text]
type = "string"
description = "Exact text to append, including any required separator or newline."

[semantic]
use_when = [
    "Add content to the end of an existing text file",
    "Incrementally build up file content",
    "Append a section, log entry, or data to an existing resource"
]
avoid_when = [
    "Need to replace specific text; use workspace.edit",
    "Target file doesn't exist; use workspace.write",
    "Target is not a UTF-8 text file",
    "Need to insert in the middle; use workspace.edit"
]
effects = ["modifying"]
examples = [
    "Append findings section to workspace:docs/report.md",
    "Add new log entry to workspace:logs/activity.log"
]

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "workspace.append"
