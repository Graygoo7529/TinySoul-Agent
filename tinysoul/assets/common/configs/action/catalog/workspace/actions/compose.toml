name = "workspace.compose"
domain = "workspace"

[tool]
description = "Generate a complete bounded text artifact from task-local resources. Use overwrite to replace an existing complete target."

[tool.schema]
type = "object"
required = ["target_ref","instruction"]
additionalProperties = false

[tool.schema.properties]

[tool.schema.properties.target_ref]
type = "string"

[tool.schema.properties.instruction]
type = "string"

[tool.schema.properties.overwrite]
type = "boolean"

[tool.schema.properties.references]
type = "array"

[tool.schema.properties.references.items]
type = "string"

[semantic]
use_when = [
    "Generate complete file content using LLM with bounded references",
    "Synthesize new document from existing workspace resources",
    "Create artifact from instruction and reference materials"
]
avoid_when = [
    "Content is already prepared; use workspace.write",
    "Only need to modify existing file; use workspace.edit or append",
    "References exceed LLM context budget; break down task"
]
effects = ["modifying"]
examples = [
    "Compose workspace:summary.md from instruction and workspace:data/*.json refs",
    "Generate report by synthesizing workspace:results/ content"
]

[runtime]
parallel_policy = "serial"
timeout_seconds = 600

[execution]
executor = "workspace.compose"
