name = "workspace.tag"
domain = "workspace"

[tool]
description = "Tag workspace resources as pinned, temporary, or important."

[tool.schema]
type = "object"
required = ["target_ref","tags"]
additionalProperties = false

[tool.schema.properties]

[tool.schema.properties.target_ref]
type = "string"

[tool.schema.properties.tags]
type = "array"

[tool.schema.properties.tags.items]
type = "string"
enum = ["pinned","tmp","important"]

[semantic]
use_when = [
    "Mark workspace resource with tags (pinned/tmp/important)",
    "Pin important resources to prevent auto-cleanup",
    "Mark temporary files for easier identification or long-term storage"
]
avoid_when = [
    "Tags are already correct",
    "Need custom metadata; consider workspace.describe"
]
effects = ["modifying"]
examples = [
    "Tag workspace:important.md as pinned to preserve across days",
    "Tag workspace:temp.json as tmp to indicate temporary status",
    "Tag workspace:reference.md as important for long-term storage"
]

[runtime]
parallel_policy = "serial"

[execution]
executor = "workspace.tag"
