name = "workspace.inspect"
domain = "workspace"

[tool]
description = "Inspect a known Workspace reference: read a bounded text page or section, list a directory's direct children, or identify a non-text resource. No internal model call."

[tool.schema]
type = "object"
required = ["ref"]
additionalProperties = false

[tool.schema.properties.ref]
type = "string"
description = "Exact Workspace reference; text may include #L10-L20 or a Markdown heading fragment."

[tool.schema.properties.continuation]
type = "string"
description = "Opaque continuation returned by a previous Inspect of this reference."

[tool.schema.properties.max_chars]
type = "integer"
minimum = 512
description = "Optional page budget, capped by the Workspace read limit."

[semantic]
use_when = [
    "Read a known Workspace reference returned by search or another action",
    "Follow a workspace: reference with optional line range or heading",
    "Continue a previous text or directory page with continuation",
    "List direct children of a known directory"
]
avoid_when = [
    "Discovering unknown resources; use workspace.search",
    "Modifying resource content; use write/edit/append",
    "Need deeper analysis; consider workspace.analyze"
]
effects = ["read_only"]
examples = [
    "Inspect workspace:notes/plan.md to read the file",
    "Inspect workspace:notes/plan.md#L10-L50 to read specific lines",
    "Inspect workspace:src to list direct children of the directory",
    "Continue reading with the returned continuation token"
]

[runtime]
parallel_policy = "serial"

[runtime.result]
trace_mode = "foldable"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "workspace.inspect"
