name = "workspace.restore"
domain = "workspace"

[tool]
description = "Restore one logically deleted resource from recoverable Workspace Trash."

[tool.schema]
type = "object"
required = ["trash_ref"]
additionalProperties = false

[tool.schema.properties.trash_ref]
type = "string"
description = "A trash:workspace reference returned by workspace.delete."

[semantic]
use_when = [
    "Restore a deleted resource from Workspace Trash",
    "Recover a file that was mistakenly deleted",
    "Need a previously deleted resource again"
]
avoid_when = [
    "Active resource already exists at the target path",
    "Don't have the trash_ref; use workspace.trash_list first",
    "Resource was permanently deleted (not in Trash)"
]
effects = ["modifying"]
examples = [
    "Restore trash:workspace/trash_abcd after discovering draft is needed",
    "Recover workspace:docs/important.md from Trash"
]

[runtime]
parallel_policy = "serial"

[execution]
executor = "workspace.restore"
