name = "workspace.analyze"
domain = "workspace"

[tool]
description = "Analyze explicit complete UTF-8 Workspace text references for one intent and return a bounded grounded answer without modifying Workspace."

[tool.schema]
type = "object"
required = ["intent", "references"]
additionalProperties = false

[tool.schema.properties.intent]
type = "string"
description = "Non-empty analysis intent, bounded by Workspace analysis settings."

[tool.schema.properties.references]
type = "array"
description = "One or more exact Workspace text resource Links selected by Phase2."

[tool.schema.properties.references.items]
type = "string"
description = "Exact Workspace text resource reference."

[semantic]
use_when = [
    "Need LLM to analyze specific workspace references and answer a bounded question",
    "Synthesize information from multiple workspace files",
    "Extract structured information from workspace content"
]
avoid_when = [
    "References are not known; use workspace.search first",
    "Only need to read content; use workspace.inspect",
    "Analysis would exceed reference budget; narrow scope or use search"
]
effects = ["read_only"]
examples = [
    "Analyze test and source files with intent 'What test cases are missing?'",
    "Extract API endpoints from workspace:src/routes.py"
]
examples = ["Analyze selected Action and Context implementation files for result lifecycle behavior"]

[runtime]
timeout_seconds = 600
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "workspace.analyze"
