name = "workspace.convert_with_pypdf"
domain = "workspace"

[tool]
description = "Convert a Workspace PDF to page-oriented Markdown, extracted images and attachments, rendering pages without usable text. The result returns refs and execution metadata only."

[tool.schema]
type = "object"
required = ["source_ref", "target_ref"]
additionalProperties = false

[tool.schema.properties.source_ref]
type = "string"
description = "Existing Workspace PDF ref."

[tool.schema.properties.target_ref]
type = "string"
description = "Target Workspace Markdown ref such as workspace:converted/report.md."

[tool.schema.properties.overwrite]
type = "boolean"
description = "Whether to replace the target and its owned asset bundle. Defaults to false."

[semantic]
use_when = [
    "Convert PDF to page-oriented Markdown with page-level detail",
    "Need PDF attachments, images, and scanned pages preserved",
    "Extract content from image-heavy or complex PDF documents"
]
avoid_when = [
    "Source is not PDF",
    "Ordinary document should use workspace.convert_with_markitdown",
    "PDF is already readable text; inspect or use simpler conversion"
]
effects = ["modifying"]
examples = [
    "Convert workspace:incoming/scanned.pdf to workspace:converted/scanned.md",
    "Extract page-level content from workspace:docs/complex.pdf",
    "Process image-heavy workspace:reports/visual.pdf with attachment extraction"
]

[runtime]
timeout_seconds = 90
parallel_policy = "serial"

[execution]
executor = "resource.convert_with_pypdf"
