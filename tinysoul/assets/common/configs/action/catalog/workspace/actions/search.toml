name = "workspace.search"
domain = "workspace"

[tool]
description = "Compose query, backlinks, directory, refs, result, filter, select and rerank over current Workspace resources. Query retains literal/regex semantics; results include real previews."

[tool.schema]
type = "object"
additionalProperties = false

[tool.schema.properties.source]
type = "object"

[tool.schema.properties.steps]
type = "array"
items = { type = "object" }

[tool.schema.properties.page]
type = "object"

[tool.schema.properties.continuation]
type = "string"

[semantic]
use_when = [
    "Discover resources by content pattern (literal text or regex)",
    "Find incoming Markdown references to a resource (backlinks)",
    "Explore directory structure with semantic discovery",
    "Locate resources before deeper reading or mutation"
]
avoid_when = [
    "The exact reference is already known; use workspace.inspect",
    "Need to change resource content; search then mutate",
    "Pattern is too broad; narrow the scope first"
]
effects = ["read_only"]
examples = [
    "Search workspace for 'TODO' items",
    "Find backlinks to workspace:docs/api.md",
    "Discover Python files about 'authentication' in workspace:src",
    "List all Markdown files in workspace",
    "Search the workspace:tinysoul/workspace/ directory for WorkspaceContractError"
]

[runtime]
parallel_policy = "serial"

[runtime.result]
trace_mode = "foldable"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "workspace.search"
