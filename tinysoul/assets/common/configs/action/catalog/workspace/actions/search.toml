name = "workspace.search"
domain = "workspace"

[tool]
description = "Compose query, backlinks, directory, refs, result, filter, select and rerank over current Workspace resources. Query retains literal/regex semantics; results include real previews."

[tool.schema]
type = "object"
additionalProperties = false

[tool.schema.properties.source]
type = "object"

[tool.schema.properties.steps]
type = "array"
items = { type = "object" }

[tool.schema.properties.page]
type = "object"

[tool.schema.properties.continuation]
type = "string"

[semantic]
use_when = ["Discover Workspace resources with literal/regex query, directory, or real backlinks", "Select or rerank real candidate content using a criterion and optional Context"]
avoid_when = ["Read a known exact text range without candidate operations; use workspace.read"]
effects = ["read_only"]
examples = ["Search the workspace:tinysoul/workspace/ directory for WorkspaceContractError"]

[runtime]
parallel_policy = "serial"

[runtime.result]
trace_mode = "foldable"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "workspace.search"
