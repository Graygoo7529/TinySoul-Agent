name = "workspace.search"
domain = "workspace"

[tool]
description = "Search one explicit Workspace text scope for bounded literal or regular-expression matches."

[tool.schema]
type = "object"
required = ["query", "scope"]
additionalProperties = false

[tool.schema.properties.query]
type = "string"
description = "Non-empty single-line literal query. Enable regex for a bounded regular expression."

[tool.schema.properties.scope]
type = "object"
required = ["kind", "locator"]
additionalProperties = false

[tool.schema.properties.scope.properties.kind]
type = "string"
enum = ["file", "directory", "workspace"]

[tool.schema.properties.scope.properties.locator]
type = "string"
description = "Exact Workspace text Link for file scope, directory prefix for directory scope, or an empty string for workspace scope."

[tool.schema.properties.case_sensitive]
type = "boolean"
description = "Whether matching is case-sensitive. Defaults to false."

[tool.schema.properties.top_k]
type = "integer"
description = "Optional number of fragments, bounded by Workspace search settings."

[tool.schema.properties.regex]
type = "boolean"
description = "Enable regular expressions with a bounded execution budget."

[semantic]
use_when = ["A term, identifier, or regex pattern should be located in a known file, directory, or the current Workspace", "Source line hints and nearby fragments are useful"]
avoid_when = ["The exact line range is already known", "A semantic interpretation rather than literal matching is required"]
effects = ["read_only"]
examples = ["Search the workspace:tinysoul/workspace/ directory for WorkspaceContractError"]

[runtime]
parallel_policy = "serial"

[runtime.result]
trace_mode = "foldable"

[runtime.hooks]
normalize = []
execute = []

[backend]
kind = "native"
handler = "workspace.search"
