name = "workspace.search"
domain = "workspace"

[tool]
description = "Compose query, backlinks, directory, refs, result, filter, select and rerank over current Workspace resources. Query retains literal/regex semantics; results include real previews."

[tool.schema]
type = "object"
additionalProperties = false

[tool.schema.properties.source]
type = "object"

[tool.schema.properties.steps]
type = "array"
items = { type = "object" }

[tool.schema.properties.page]
type = "object"

[tool.schema.properties.continuation]
type = "string"

[semantic]
use_when = ["A term, identifier, or regex pattern should be located in a known file, directory, or the current Workspace", "Source line hints and nearby fragments are useful"]
avoid_when = ["The exact line range is already known", "A semantic interpretation rather than literal matching is required"]
effects = ["read_only"]
examples = ["Search the workspace:tinysoul/workspace/ directory for WorkspaceContractError"]

[runtime]
parallel_policy = "serial"

[runtime.result]
trace_mode = "foldable"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "workspace.search"
