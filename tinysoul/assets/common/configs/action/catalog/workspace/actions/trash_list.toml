name = "workspace.trash_list"
domain = "workspace"

[tool]
description = "List recoverable Workspace Trash items and their restore references."

[tool.schema]
type = "object"
required = []
additionalProperties = false

[tool.schema.properties.offset]
type = "integer"
minimum = 0

[tool.schema.properties.limit]
type = "integer"
minimum = 1
maximum = 64

[semantic]
use_when = [
    "Find trash_ref before restoring a deleted Workspace resource",
    "Browse recoverable Trash items",
    "Check what deleted resources are available for restore"
]
avoid_when = [
    "Resource is still in active Workspace; use workspace.list or search",
    "Already have the trash_ref; call workspace.restore directly"
]
effects = ["read_only"]
examples = [
    "List Trash to find deleted file's trash_ref",
    "List Trash with pagination (offset and limit)",
    "Browse recoverable resources before calling workspace.restore"
]

[runtime]
parallel_policy = "serial"

[execution]
executor = "workspace.trash_list"
