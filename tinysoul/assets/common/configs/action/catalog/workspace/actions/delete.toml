name = "workspace.delete"
domain = "workspace"

[tool]
description = "Remove one resource from the active Workspace by moving it to recoverable Trash."

[tool.schema]
type = "object"
required = ["target_ref"]
additionalProperties = false

[tool.schema.properties.target_ref]
type = "string"
description = "Target workspace resource ref such as workspace:docs/task.md."

[semantic]
use_when = [
    "Remove a workspace resource that is no longer needed",
    "Delete temporary or draft files after final output is produced",
    "Clean up workspace (moved to recoverable Trash, not permanent)"
]
avoid_when = [
    "File may still be needed as task evidence or output",
    "Should rename or move instead; use workspace.move",
    "Permanent deletion is required; this only moves to Trash"
]
effects = ["modifying"]
examples = [
    "Delete workspace:tmp/draft.md after producing final document",
    "Delete workspace:cache/temp.json after processing"
]

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "workspace.delete"
