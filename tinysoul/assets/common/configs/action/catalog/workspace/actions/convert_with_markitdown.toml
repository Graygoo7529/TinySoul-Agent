name = "workspace.convert_with_markitdown"
domain = "workspace"

[tool]
description = "Convert a supported Workspace document to Markdown and a bounded sibling asset bundle using MarkItDown. The result returns refs and execution metadata only."

[tool.schema]
type = "object"
required = ["source_ref", "target_ref"]
additionalProperties = false

[tool.schema.properties.source_ref]
type = "string"
description = "Existing Workspace PDF or DOCX ref."

[tool.schema.properties.target_ref]
type = "string"
description = "Target Workspace Markdown ref such as workspace:converted/report.md."

[tool.schema.properties.overwrite]
type = "boolean"
description = "Whether to replace the target and its owned asset bundle. Defaults to false."

[semantic]
use_when = ["Need structured Markdown from an ordinary PDF or DOCX", "Need embedded document resources preserved as Workspace refs"]
avoid_when = ["Need PDF-specific page-by-page extraction or low-level PDF fallback", "The source is already a readable Workspace text resource"]
effects = ["modifying"]
examples = ["Convert workspace:incoming/report.docx to workspace:converted/report.md"]

[runtime]
timeout_seconds = 90
parallel_policy = "serial"

[execution]
executor = "resource.convert_with_markitdown"
