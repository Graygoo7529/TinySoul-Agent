name = "workspace.convert_with_markitdown"
domain = "workspace"

[tool]
description = "Convert a supported Workspace document to Markdown and a bounded sibling asset bundle using MarkItDown. The result returns refs and execution metadata only."

[tool.schema]
type = "object"
required = ["source_ref", "target_ref"]
additionalProperties = false

[tool.schema.properties.source_ref]
type = "string"
description = "Existing Workspace PDF or DOCX ref."

[tool.schema.properties.target_ref]
type = "string"
description = "Target Workspace Markdown ref such as workspace:converted/report.md."

[tool.schema.properties.overwrite]
type = "boolean"
description = "Whether to replace the target and its owned asset bundle. Defaults to false."

[semantic]
use_when = [
    "Convert supported document (PDF, DOCX, etc.) to Markdown with MarkItDown",
    "Need structured Markdown with embedded resources preserved as refs",
    "Extract document content for analysis or modification"
]
avoid_when = [
    "Need PDF-specific page-level extraction; use workspace.convert_with_pypdf",
    "Source is already readable text; use workspace.inspect",
    "Source format is not supported by MarkItDown"
]
effects = ["modifying"]
examples = [
    "Convert workspace:incoming/report.docx to workspace:converted/report.md",
    "Convert workspace:documents/presentation.pptx to Markdown",
    "Extract content from workspace:files/data.pdf to readable format"
]

[runtime]
timeout_seconds = 90
parallel_policy = "serial"

[execution]
executor = "resource.convert_with_markitdown"
