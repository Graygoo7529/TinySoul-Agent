name = "workspace.read"
domain = "workspace"

[tool]
description = "Read one explicit bounded line range from a UTF-8 Workspace text resource."

[tool.schema]
type = "object"
required = ["ref"]
additionalProperties = false

[tool.schema.properties.ref]
type = "string"
description = "Exact Workspace text resource ref."

[tool.schema.properties.start_line]
type = "integer"
description = "1-based inclusive start line."

[tool.schema.properties.end_line]
type = "integer"
description = "1-based inclusive end line."

[tool.schema.properties.max_chars]
type = "integer"
description = "Optional positive result text limit that can only tighten the Workspace limit."

[tool.schema.properties.cursor]
type = "integer"
description = "Optional 0-based continuation cursor within the requested line range."

[semantic]
use_when = [
    "Read a specific line range from a known workspace text file",
    "Continue reading with cursor from previous read",
    "Extract bounded section from exact workspace reference"
]
avoid_when = [
    "File or line range is unknown; use workspace.search first",
    "Need full file inspection with disclosure; use workspace.inspect",
    "Document needs conversion; use convert actions first",
    "Should modify content; use workspace.edit"
]
effects = ["read_only"]
examples = [
    "Read lines 120-180 from workspace:src/service.py",
    "Read first 50 lines of workspace:README.md"
]

[runtime]
parallel_policy = "serial"

[runtime.result]
trace_mode = "foldable"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "workspace.read"
