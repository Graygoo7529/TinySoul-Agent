name = "workspace.edit"
domain = "workspace"

[tool]
description = "Apply ordered exact replacements. Every old_text must occur exactly once; commit all edits together."

[tool.schema]
type = "object"
required = ["target_ref","edits"]
additionalProperties = false

[tool.schema.properties]

[tool.schema.properties.target_ref]
type = "string"

[tool.schema.properties.edits]
type = "array"

[tool.schema.properties.edits.items]
type = "object"
required = ["old_text","new_text"]
additionalProperties = false

[tool.schema.properties.edits.items.properties]

[tool.schema.properties.edits.items.properties.old_text]
type = "string"

[tool.schema.properties.edits.items.properties.new_text]
type = "string"

[semantic]
use_when = [
    "Apply precise text replacements to an existing file",
    "Multiple exact string replacements in one atomic operation",
    "Preserve most of the file while changing specific parts"
]
avoid_when = [
    "Creating a new file; use workspace.write",
    "Old_text doesn't occur exactly once in the file",
    "Need to generate new content; consider workspace.compose"
]
effects = ["modifying"]
examples = [
    "Replace 'old_function_name' with 'new_function_name' in workspace:src/main.py",
    "Apply multiple edits atomically to workspace:config.yaml"
]

[runtime]
parallel_policy = "serial"

[execution]
executor = "workspace.edit"
