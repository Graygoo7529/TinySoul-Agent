name = "core.job.stop"
domain = "core"

[tool]
description = "Request a Job stop and join its execution before returning. Repeating a stop preserves the terminal fact."

[tool.schema]
type = "object"
required = ["job_id"]
additionalProperties = false

[tool.schema.properties.job_id]
type = "string"
description = "Job identity returned by a start action in this Turn."

[semantic]
use_when = [
    "A running Job should be terminated early",
    "Job is no longer needed for current goal"
]
avoid_when = [
    "Job is already completed or not started",
    "Should wait for Job completion instead"
]
effects = ["modifying"]
examples = [
    "Stop a long-running execution Job that is no longer needed",
    "Cancel a Job after receiving enough output"
]

[runtime]
timeout_seconds = 10
parallel_policy = "serial"

[execution]
executor = "core.job.stop"
