name = "core.ask"
domain = "core"

[tool]
description = "Ask for a decision or missing information and pause this Turn until the matching reply arrives. Ordinary additional input does not answer the question."

[tool.schema]
type = "object"
required = ["question"]
additionalProperties = false

[tool.schema.properties.question]
type = "string"
description = "The core question the user should answer. Together with details, this forms the complete question body."
maxLength = 16000

[tool.schema.properties.details]
type = "string"
description = "The explanation needed to understand and answer the question: relevant findings, choices, tradeoffs or advice. Supports Markdown; may be omitted for a self-explanatory question."
maxLength = 16000

[tool.schema.properties.options]
type = "array"
description = "Optional choices with stable IDs. A reply identifies one ID, or supplies free text when allow_other is true."
maxItems = 8
items = { type = "object", required = ["id", "label"], additionalProperties = false, properties = { id = { type = "string", minLength = 1, maxLength = 128 }, label = { type = "string", minLength = 1, maxLength = 256 }, description = { type = "string", maxLength = 2000 } } }

[tool.schema.properties.allow_other]
type = "boolean"
description = "Allow a free-text response alongside choices. Defaults to true."

[tool.schema.properties.timeout_seconds]
type = "number"
minimum = 0.001
description = "Optional waiting limit. Omit to wait until reply or cancellation."

[semantic]
use_when = [
    "Continuing needs the user's decision among consequential alternatives",
    "Missing information cannot be investigated with available actions",
    "Need explicit permission for a significant or irreversible action",
    "Multiple feasible routes exist and user preference matters",
    "A difficulty or unclear meaning needs the user's assistance",
    "A candidate direction or solution needs the user's view before continuing"
]
avoid_when = [
    "The information can be investigated with inspect/search/read actions",
    "The decision is technical and can be made from Context evidence",
    "Would interrupt flow for a minor clarification that can be deferred"
]
effects = ["read_only"]
examples = [
    "Ask the user to choose between two refactoring approaches after explaining tradeoffs",
    "Request missing API credentials that cannot be found in Context",
    "Confirm deletion of important resources before proceeding",
    "Ask whether to continue a long-running process that will consume significant time",
    "Present two plausible interpretations of an unclear requirement and ask which direction to pursue"
]

[runtime]
timeout_seconds = 5
parallel_policy = "serial"

[execution]
executor = "core.ask"
