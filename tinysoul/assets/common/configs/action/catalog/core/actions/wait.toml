name = "core.wait"
domain = "core"

[tool]
description = "Pause before the next Cycle until a timer expires or an explicitly selected event arrives. event_kind=job waits for any Job terminal result or request needing your response; passive state refreshes do not interrupt unless an event filter is explicit. User instructions and decision-required environment events can interrupt. Waiting never grants Cycle budget."

[tool.schema]
type = "object"
additionalProperties = false

[tool.schema.properties.timeout_seconds]
type = "number"
minimum = 0.001
description = "Positive duration. With an event filter, either event or deadline resumes the Turn."

[tool.schema.properties.event_kind]
type = "string"
enum = ["event", "timer", "job"]

[tool.schema.properties.event_id]
type = "string"
description = "Optional exact environment event identity; does not restrict Job wakeups."

[tool.schema.properties.topic]
type = "string"
description = "Optional topic for environment event interruptions. workspace.changed reports committed current Workspace changes; an explicit topic selects even passive refreshes and implies event_kind=event."

[tool.schema.properties.source]
type = "string"
description = "Optional source for environment event interruptions. workspace.fswatch senses external file edits; workspace.owner reports formal owner writes. An explicit source selects passive refreshes; source unavailability resumes this wait with explicit feedback."

[semantic]
use_when = [
    "Waiting for a Job to complete (event_kind=job)",
    "Need to delay for an external process to finish",
    "Monitoring for workspace changes from an external source"
]
avoid_when = [
    "Useful independent work can proceed in parallel",
    "Could use core.job.status for immediate Job state check",
    "External process is not actually running yet"
]
effects = ["read_only"]
examples = [
    "Wait for a started Job to complete or request input",
    "Wait 30 seconds for an external build process",
    "Monitor workspace for external file changes (source=workspace.fswatch)"
]

[runtime]
timeout_seconds = 5
parallel_policy = "serial"

[execution]
executor = "core.wait"
