name = "core.answer"
domain = "core"

[tool]
description = "Produce the user-facing response that concludes the current User Turn, optionally using read-only references."

[tool.schema]
type = "object"
required = ["guide_blocks"]
additionalProperties = false

[tool.schema.properties.guide_blocks]
type = "array"
description = "Required answer guidance blocks."

[tool.schema.properties.guide_blocks.items]
type = "object"
required = ["text"]
additionalProperties = false

[tool.schema.properties.guide_blocks.items.properties.label]
type = "string"
description = "Optional stable label for this guide block."

[tool.schema.properties.guide_blocks.items.properties.text]
type = "string"
description = "Guide text for the final answer task."

[tool.schema.properties.input_blocks]
type = "array"
description = "Optional answer-specific input blocks."

[tool.schema.properties.input_blocks.items]
type = "object"
required = ["text"]
additionalProperties = false

[tool.schema.properties.input_blocks.items.properties.label]
type = "string"
description = "Optional stable label for this input block."

[tool.schema.properties.input_blocks.items.properties.text]
type = "string"
description = "Input text for the final answer task."

[tool.schema.properties.references]
type = "array"
description = "Optional read-only resource references to use as answer sources."

[tool.schema.properties.references.items]
type = "string"
description = "Read-only resource reference, for example workspace:docs/task.md."

[semantic]
use_when = [
    "The current Turn is ready to report results after the necessary reading, analysis, changes, and checks",
    "Further progress depends on user input, and this Turn should end with a focused question, confirmation, request for direction, or choice among feasible routes",
    "Useful work is complete and no unresolved actions or jobs remain"
]
avoid_when = [
    "Necessary reading, analysis, changes, or checks can still be completed without further user input",
    "The Turn should continue after a reply; prefer core.ask to pause and wait",
    "The response would only be hidden reasoning without delivering value",
    "Active Jobs or unresolved actions need attention first"
]
effects = ["read_only"]
examples = [
    "Answer the user's direct question after gathering enough context",
    "Request missing API credentials that cannot be found in Context",
    "Ask the user to choose between refactoring approaches after explaining tradeoffs",
    "Deliver completed implementation results with verification summary"
]

[runtime]
timeout_seconds = 600
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "core.answer"
