name = "core.context.search"
domain = "core"

[tool]
description = "Compose query, backlinks, directory, refs, result, filter, select and rerank over current Turn and Session facts without loading Background. Results include references and real content previews."
schema = { type = "object", properties = { source = { type = "object" }, steps = { type = "array" }, exclude_refs = { type = "array", items = { type = "string" } }, page = { type = "object" } }, required = ["source"], additionalProperties = false }

[semantic]
use_when = [
    "Need to discover relevant Turn or Session evidence not yet visible",
    "Search for patterns across current Turn or historical Sessions",
    "Find backlinks or related interactions in session history"
]
avoid_when = [
    "The needed content is already visible in Context",
    "Should use home/memory/workspace search for those resources",
    "Exact reference is known; use core.context.inspect instead"
]
effects = ["read_only"]
examples = [
    "Search Session for prior discussions about 'authentication'",
    "Find Turns that reference a specific workspace file",
    "Discover related topics in session map"
]

[runtime]
timeout_seconds = 600
parallel_policy = "allowed"

[runtime.result]
trace_mode = "foldable"

[execution]
executor = "core.context.search"
