name = "core.context.search"
domain = "core"

[tool]
description = "Compose query, backlinks, directory, refs, result, filter, select and rerank over current Turn and Session facts without loading Background. Results include links and real content previews."
schema = { type = "object", properties = { source = { type = "object" }, steps = { type = "array" }, exclude_refs = { type = "array", items = { type = "string" } }, page = { type = "object" } }, required = ["source"], additionalProperties = false }

[semantic]
use_when = ["Useful raw Turn or Session evidence is not yet in the visible Context"]
avoid_when = ["Changing resource content"]
effects = ["read_only"]

[runtime]
timeout_seconds = 600
parallel_policy = "allowed"

[runtime.result]
trace_mode = "foldable"

[execution]
executor = "core.context.search"
