name = "core.session.organize"
domain = "core"

[tool]
description = "Revise today's conversation understanding: create or revise topics, notes, memberships and source-backed relations over completed Turns. Facts remain unchanged. Use a visible session:node/ or session:edge/ ref to revise; use local:<key> for a new object, including references within this call. Each upsert supplies the object's full semantic fields. source_refs must identify history facts or accepted current inputs/settled actions. No extra model call is made."

[tool.schema]
type = "object"
required = ["scope_refs"]
additionalProperties = false

[tool.schema.properties.scope_refs]
type = "array"
minItems = 1
maxItems = 64
items = { type = "string", minLength = 1, maxLength = 240 }
description = "Completed history facts or existing annotations being reconsidered. Current evidence does not make the active Turn part of history."

[tool.schema.properties.upsert_nodes]
type = "array"
maxItems = 32
items = { type = "object", required = ["ref", "kind", "title", "body", "source_refs"], additionalProperties = false, properties = { ref = { type = "string", maxLength = 240 }, kind = { type = "string", enum = ["thread", "note"] }, title = { type = "string", minLength = 1, maxLength = 160 }, body = { type = "string", minLength = 1, maxLength = 4000 }, source_refs = { type = "array", minItems = 1, maxItems = 32, items = { type = "string", maxLength = 240 } } } }

[tool.schema.properties.upsert_edges]
type = "array"
maxItems = 64
items = { type = "object", required = ["ref", "source", "target", "relation", "body", "source_refs"], additionalProperties = false, properties = { ref = { type = "string", maxLength = 240 }, source = { type = "string", maxLength = 240 }, target = { type = "string", maxLength = 240 }, relation = { type = "string", enum = ["covers", "continues", "branches_from", "clarifies", "revises", "supports", "contradicts", "resolves", "steers"] }, body = { type = "string", minLength = 1, maxLength = 4000 }, source_refs = { type = "array", minItems = 1, maxItems = 32, items = { type = "string", maxLength = 240 } } } }
description = "covers links a thread to a history Turn/fact. Other relations explain development or evidence; time order alone does not establish causality."

[tool.schema.properties.retract_ids]
type = "array"
maxItems = 96
items = { type = "string", maxLength = 240 }
description = "Existing semantic refs to retract, preserving their identity. When retracting a node, retract or redirect its active relations in this same call."

[semantic]
use_when = ["New evidence changes the understanding of prior conversation", "Related Turns need topics, branches, shared references or corrected relationships"]
avoid_when = ["There is no completed history", "Only display expansion or exact reading is needed; use core.context.inspect"]
effects = ["modifying"]

[visibility]
default = false
[visibility.scenarios]
user = true

[runtime]
parallel_policy = "serial"

[backend]
kind = "native"
handler = "core.session.organize"
