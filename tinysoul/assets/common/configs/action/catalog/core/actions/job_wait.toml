name = "core.job.wait"
domain = "core"

[tool]
description = "Pause the Turn until this Job reaches a terminal state, optional deadline, or new user instructions."

[tool.schema]
type = "object"
required = ["job_id"]
additionalProperties = false

[tool.schema.properties.job_id]
type = "string"
description = "Job identity returned by a start action in this Turn."

[tool.schema.properties.timeout_seconds]
type = "number"
minimum = 0.001

[semantic]
use_when = ["Supervising work already started in this Turn"]
avoid_when = ["No matching Job exists"]
effects = ["read_only"]

[runtime]
timeout_seconds = 10
parallel_policy = "serial"

[execution]
executor = "core.job.wait"
