name = "core.context.inspect"
domain = "core"

[tool]
description = "Follow Context clues to bounded detail and child references, or locate evidence within a reference using query. Supports current Turn trace and the current day's prior-Turn Session Map."

[tool.schema]
type = "object"
required = ["ref"]
additionalProperties = false

[tool.schema.properties.ref]
type = "string"
description = "A visible turn:trace ref, session:map entry point, Session topic/annotation/history directory, Turn or factual occurrence ref."

[tool.schema.properties.continuation]
type = "string"
description = "Opaque continuation returned for unfinished content with this same ref and query."

[tool.schema.properties.query]
type = "string"
description = "Optional text to find within this reference's facts. Omit to navigate clues and child references."

[semantic]
use_when = [
    "Need to recall folded Trace nodes or Session Turn details",
    "A reference in Context needs its content to proceed",
    "Session map shows relevant topics but history is folded"
]
avoid_when = [
    "The needed content is already visible in Context",
    "Should use home/memory/workspace inspect for those owners",
    "General discovery is needed; use core.context.search instead"
]
effects = ["read_only"]
examples = [
    "Inspect turn:trace/2026-10-14/5#entry/12 to recall a folded action result",
    "Inspect session:turn/2026-10-14/3 to recall prior Turn interactions",
    "Inspect session:map to navigate topics and their relationships"
]

[runtime]
timeout_seconds = 5
parallel_policy = "serial"

[runtime.result]
trace_mode = "foldable"

[execution]
executor = "context.inspect"
