name = "memory.write"
domain = "memory"

[tool]
description = "Replace one entity/concept/fact/note Markdown document. Search or inspect existing Memory first. YAML schema_version=2 requires kind, cite, status, created_on, updated_on, relations, evidence, redirect_to; fact also summary, note also title; confidence is optional. Relations reference entity/concept; evidence references daily/fact/note. References and redirect targets must already exist. Inactive documents retain migration text and a valid non-daily redirect."
schema = { type = "object", properties = { ref = { type = "string" }, markdown = { type = "string" } }, required = ["ref", "markdown"], additionalProperties = false }

[semantic]
use_when = [
    "Replace entity/concept/fact/note Markdown document in Memory",
    "Update existing Memory content after inspection",
    "Commit structured knowledge to persistent Memory (Reflection Turn only)"
]
avoid_when = [
    "Haven't inspected existing Memory content first",
    "Not in Memory Reflection Turn (visibility restricted)",
    "Need to write daily content; use memory.write_daily"
]
effects = ["modifying"]
examples = [
    "Write memory:entity/project_name with complete YAML frontmatter and body",
    "Update memory:concept/architecture with new understanding",
    "Replace memory:fact/key_decision with corrected information"
]

[visibility]
default = false
[visibility.scenarios]
memory_reflection = true

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "memory.write"


