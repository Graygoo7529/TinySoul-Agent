name = "memory.search"
domain = "memory"

[tool]
description = "Compose registered query, backlinks, directory, refs, result, filter, select and rerank operations over persistent Memory. Query accepts text or an explicit document_ref. Results include refs and real content previews; operation models are configured internally."
schema = { type = "object", properties = { source = { type = "object" }, steps = { type = "array" }, exclude_refs = { type = "array", items = { type = "string" } }, page = { type = "object" } }, required = ["source"], additionalProperties = false }

[semantic]
use_when = [
    "Need to discover persistent Memory documents (daily/entity/concept/fact/note)",
    "Search for patterns across Memory knowledge base",
    "Find backlinks or related Memory documents"
]
avoid_when = [
    "Exact memory:entity/name reference is already known; use memory.inspect",
    "Current Memory.md is sufficient; memory.search is for persistent docs",
    "Should search workspace or session instead"
]
effects = ["read_only"]
examples = [
    "Search Memory for entity 'TinySoul'",
    "Find Memory documents referencing memory:concept/context-model",
    "Discover facts about 'agent architecture'"
]

[runtime]
timeout_seconds = 600
parallel_policy = "allowed"

[runtime.result]
trace_mode = "foldable"

[execution]
executor = "memory.search"
