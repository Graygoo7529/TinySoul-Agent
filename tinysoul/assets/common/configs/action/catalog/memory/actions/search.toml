name = "memory.search"
domain = "memory"

[tool]
description = "Compose registered query, backlinks, directory, refs, result, filter, select and rerank operations over persistent Memory. Results include links and real content previews; operation models are configured internally."
schema = { type = "object", properties = { source = { type = "object" }, steps = { type = "array" }, exclude_refs = { type = "array", items = { type = "string" } }, page = { type = "object" } }, required = ["source"], additionalProperties = false }

[semantic]
use_when = ["Persistent Memory evidence or relevant document links should be discovered"]
avoid_when = ["Changing resource content"]
effects = ["read_only"]

[runtime]
timeout_seconds = 600
parallel_policy = "allowed"

[runtime.result]
trace_mode = "foldable"

[execution]
executor = "memory.search"
