name = "expand.describe_tools"
domain = "expand"

[tool]
description = "Read complete definitions for tools or server_ids (exactly one selector), with bounded pages."

[tool.schema]
type = "object"
required = []
additionalProperties = false

[tool.schema.properties.tools]
type = "array"
items = { type = "object", required = ["server_id", "tool_name"], additionalProperties = false, properties = { server_id = { type = "string" }, tool_name = { type = "string" } } }

[tool.schema.properties.server_ids]
type = "array"
items = { type = "string" }

[tool.schema.properties.page]
type = "string"

[semantic]
use_when = [
    "Read complete inputSchema and outputSchema for specific tools before calling them",
    "Get full parameter definitions when expand.search excerpts are insufficient",
    "Browse all tools from one or more servers in detail",
    "Verify exact argument structure before constructing expand.call parameters"
]
avoid_when = [
    "Only need a high-level overview; use expand.describe_servers instead",
    "Want to find tools semantically; use expand.search with directory or query",
    "Already have the complete definition from a previous search result"
]
effects = ["read_only"]
examples = [
    "Read complete definition for tools=[{'server_id': 'notes', 'tool_name': 'search'}]",
    "Get all tool definitions from 'docs' server using server_ids=['docs']",
    "Verify inputSchema for a tool discovered via expand.search before calling it",
    "Browse paginated tool definitions for multiple servers to understand capabilities"
]

[execution]
executor = "expand.describe_tools"
