name = "expand.describe_servers"
domain = "expand"

[tool]
description = "Browse configured MCP services and bounded tool summaries; use page to continue."

[tool.schema]
type = "object"
required = []
additionalProperties = false

[tool.schema.properties.server_ids]
type = "array"
items = { type = "string" }

[tool.schema.properties.page]
type = "string"

[semantic]
use_when = [
    "Discover which MCP servers are available and their high-level capabilities",
    "Get a quick overview of tools provided by configured servers before detailed lookup",
    "Check server availability status (ready, unavailable, error)",
    "Narrow down which servers to investigate further with describe_tools or search"
]
avoid_when = [
    "Already know the specific server and tool to use; call expand.call directly",
    "Need complete tool schemas; use expand.describe_tools instead",
    "Looking for tools by semantic meaning; use expand.search with directory instead"
]
effects = ["read_only"]
examples = [
    "List all configured MCP servers to understand available external capabilities",
    "Check which servers are ready before attempting tool discovery",
    "Get tool count and descriptions for 'notes' and 'docs' servers",
    "Browse server summaries then use expand.search to find specific tools semantically"
]

[execution]
executor = "expand.describe_servers"
