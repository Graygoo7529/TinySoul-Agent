name = "home.search"
domain = "home"

[tool]
description = "Compose registered query, backlinks, directory, refs, result, filter, select and rerank operations over effective Home. Query/directory aggregate Skill resources; refs read the exact entry or fragment. Results include refs and real content previews; operation models are configured internally."
schema = { type = "object", properties = { source = { type = "object" }, steps = { type = "array" }, exclude_refs = { type = "array", items = { type = "string" } }, page = { type = "object" } }, required = ["source"], additionalProperties = false }

[semantic]
use_when = [
    "Discover relevant Home agent or Skill resources",
    "Find Home knowledge not yet exposed in Context",
    "Search for topics across Home skills"
]
avoid_when = [
    "Exact home:top/path reference is already known; use home.inspect",
    "Should use load_background for top-level content instead",
    "Searching workspace or memory; use those domains"
]
effects = ["read_only"]
examples = [
    "Search Home for skills about 'context usage'",
    "Find Home resources referencing home:top/agent/identity/soul",
    "Discover agent guidance on 'working principles'"
]

[runtime]
timeout_seconds = 600
parallel_policy = "allowed"

[runtime.result]
trace_mode = "foldable"

[execution]
executor = "home.search"
