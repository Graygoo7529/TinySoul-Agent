name = "home.prompt_mount.patch"
domain = "home"

[tool]
description = "Replace one unique text fragment in an Action Catalog-defined prompt mount."
schema = { type = "object", properties = { ref = { type = "string", description = "home:mount/domain/<domain> or home:mount/action/<domain>/<action>." }, old_text = { type = "string" }, new_text = { type = "string" }, expected_digest = { type = "string" } }, required = ["ref", "old_text", "new_text"], additionalProperties = false }

[semantic]
use_when = ["A small exact change is needed in a framework-defined domain or action skill mount"]
avoid_when = ["The logical mount does not exist in the Action Catalog", "The old text is ambiguous"]
effects = ["modifying"]
examples = ["Patch one constraint in home:mount/action/workspace/rewrite"]

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "home.prompt_mount.patch"
