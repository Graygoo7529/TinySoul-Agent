name = "home.resource.write"
domain = "home"

[tool]
description = "Create or replace one progressive Agent Home text resource in the active runtime overlay."
schema = { type = "object", properties = { ref = { type = "string", description = "Progressive home:*/ resource ref; top-level refs are not accepted." }, text = { type = "string", description = "Complete UTF-8 text content." }, overwrite = { type = "boolean", description = "Whether an existing effective resource may be replaced." }, expected_digest = { type = "string", description = "Optional current effective digest precondition." } }, required = ["ref", "text"], additionalProperties = false }

[semantic]
use_when = [
    "Create or replace progressive Agent Home resource (not top-level)",
    "Write reference material, checklists, or skill resources",
    "Add progressive content to home:resource/*/ hierarchy"
]
avoid_when = [
    "Need to write top-level Agent or skill entry; use home.top.write",
    "Should modify persistent Memory; use memory actions",
    "Target is automatic prompt mount; use home.prompt_mount.write"
]
effects = ["modifying"]
examples = [
    "Create home:resource/skills/refactor/references/checklist.md",
    "Write home:resource/guides/api_usage.md for skill reference",
    "Replace home:resource/templates/pattern.md with updated content"
]

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "home.resource.write"
