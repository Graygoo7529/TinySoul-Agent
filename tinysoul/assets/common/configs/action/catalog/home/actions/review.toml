name = "home.review"
domain = "home"

[tool]
description = "Accept or reject selected effective Home changes by their Home Links. Use common Home actions to revise copies first. Each item commits independently; failures do not undo earlier accepted changes."
schema = { type = "object", properties = { paths = { type = "array", items = { type = "string" } }, decision = { type = "string", enum = ["accept", "reject"] } }, required = ["paths", "decision"], additionalProperties = false }

[semantic]
use_when = [
    "Accept or reject selected effective Home changes during Home Reflection",
    "Commit inspected Home changes to runtime after review",
    "Discard unwanted Home changes (reject decision)"
]
avoid_when = [
    "Haven't inspected changes with home.diff first",
    "Not in Home Reflection Turn (visibility restricted)",
    "Need to revise content first; use home resource/top actions"
]
effects = ["modifying"]
examples = [
    "Accept Home changes: home.review(paths=[...], decision=\"accept\")",
    "Reject unwanted changes: home.review(paths=[...], decision=\"reject\")",
    "Commit selected Home Links after inspection and revision"
]

[visibility]
default = false
[visibility.scenarios]
home_reflection = true

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "home.review"

