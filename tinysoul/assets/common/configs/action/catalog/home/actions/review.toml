name = "home.review"
domain = "home"

[tool]
description = "Accept or reject selected effective Home changes by their Home Links. Use common Home actions to revise copies first. Each item commits independently; failures do not undo earlier accepted changes."
schema = { type = "object", properties = { paths = { type = "array", items = { type = "string" } }, decision = { type = "string", enum = ["accept", "reject"] } }, required = ["paths", "decision"], additionalProperties = false }

[semantic]
use_when = ["Relevant sources and existing owner content have been inspected"]
effects = ["modifying"]

[visibility]
default = false
[visibility.scenarios]
home_reflection = true

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[backend]
kind = "native"
handler = "home.review"

