name = "home.top.delete"
domain = "home"

[tool]
description = "Tombstone one top-level Agent Home entry in the active overlay."
schema = { type = "object", properties = { ref = { type = "string", description = "Stable home:top/<space>/<name> reference." }, expected_digest = { type = "string" } }, required = ["ref"], additionalProperties = false }

[semantic]
use_when = ["An obsolete top-level skill or non-core AGENT entry should leave the effective view"]
avoid_when = ["home:top/agent/AGENT should be deleted", "A long-term Memory should change"]
effects = ["modifying"]
examples = ["Delete an obsolete home:top/skills/old_rule entry"]

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "home.top.delete"
