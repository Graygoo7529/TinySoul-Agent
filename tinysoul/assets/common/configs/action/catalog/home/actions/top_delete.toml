name = "home.top.delete"
domain = "home"

[tool]
description = "Tombstone one top-level Agent Home entry in the active overlay."
schema = { type = "object", properties = { ref = { type = "string", description = "Stable home:top/<space>/<name> reference." }, expected_digest = { type = "string" } }, required = ["ref"], additionalProperties = false }

[semantic]
use_when = [
    "Remove obsolete top-level skill from effective view",
    "Delete non-core AGENT entry from active overlay",
    "Tombstone top-level entry (not permanent deletion)"
]
avoid_when = [
    "Deleting home:top/agent/AGENT itself (core entry)",
    "Should modify persistent Memory; use memory actions",
    "Need to delete progressive resource; use home.resource.delete"
]
effects = ["modifying"]
examples = [
    "Delete home:top/skills/obsolete_rule",
    "Remove home:top/skills/deprecated_tool from overlay",
    "Tombstone top-level entry with home.top.delete"
]

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[execution]
executor = "home.top.delete"
