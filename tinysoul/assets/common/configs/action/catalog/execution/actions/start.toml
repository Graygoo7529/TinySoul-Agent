name = "execution.start"
domain = "execution"
[tool]
description = "Start one command or script as a Turn-owned Job. Set exactly one of command or source_ref; commands use bash, powershell, or cmd, while scripts also support python."
[tool.schema]
type = "object"
required = ["interpreter"]
additionalProperties = false
oneOf = [
  { type = "object", required = ["interpreter", "command"], additionalProperties = false, properties = { interpreter = { type = "string", enum = ["bash", "powershell", "cmd"] }, command = { type = "string" }, cwd_ref = { type = "string" }, interactive = { type = "boolean" } } },
  { type = "object", required = ["interpreter", "source_ref"], additionalProperties = false, properties = { interpreter = { type = "string", enum = ["python", "bash", "powershell", "cmd"] }, source_ref = { type = "string" }, args = { type = "array", items = { type = "string" } }, cwd_ref = { type = "string" }, interactive = { type = "boolean" } } }
]
[tool.schema.properties.interpreter]
type = "string"
enum = ["python", "bash", "powershell", "cmd"]
description = "Choose the interpreter for this command or script; python is only valid with source_ref."
[tool.schema.properties.command]
type = "string"
description = "One shell command, mutually exclusive with source_ref."
[tool.schema.properties.source_ref]
type = "string"
description = "Reference to an existing Home or Workspace script, mutually exclusive with command."
[tool.schema.properties.args]
type = "array"
items = { type = "string" }
description = "Arguments passed to the script interpreter; only use with source_ref."
[tool.schema.properties.cwd_ref]
type = "string"
description = "Optional existing Workspace directory; omit to use the Job's default directory."
[tool.schema.properties.interactive]
type = "boolean"
description = "Keep stdin available for execution.stdin while this Job runs."
[semantic]
use_when = [
    "Command or script needs supervision across multiple Cycles",
    "Long-running process that exceeds action timeout",
    "Interactive process requiring execution.stdin later"
]
avoid_when = [
    "Process completes quickly within action timeout; use execution.run",
    "Previous Job is still running for same task"
]
effects = ["modifying"]
examples = [
    "Start long test suite as supervised Job",
    "Start interactive shell for multi-step commands",
    "Launch server process that runs across Cycles"
]
[runtime]
parallel_policy = "serial"
[execution]
executor = "execution.start"
