name = "execution.collect"
domain = "execution"
[tool]
description = "Read bounded incremental output and exit facts from a Turn-owned execution Job."
[tool.schema]
type = "object"
required = ["job_id"]
additionalProperties = false
[tool.schema.properties.job_id]
type = "string"
[tool.schema.properties.stdout_cursor]
type = "integer"
[tool.schema.properties.stderr_cursor]
type = "integer"
[tool.schema.properties.max_chars]
type = "integer"
[semantic]
use_when = [
    "Need to read new output from a running or completed Job",
    "Check Job status and collect stdout/stderr incrementally",
    "Verify Job completion and read terminal facts"
]
avoid_when = [
    "Job has not been started yet; use execution.start first",
    "Should wait without collecting; use core.wait",
    "Should stop the Job; use core.job.stop"
]
effects = ["read_only"]
examples = [
    "Collect new output from test Job",
    "Read exit code and final output after Job completes",
    "Check progress of long-running Job"
]
[runtime]
parallel_policy = "serial"
[execution]
executor = "execution.collect"
