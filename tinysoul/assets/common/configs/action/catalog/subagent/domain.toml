name = "subagent"
description = "Delegate work to configured external ACP Agents and supervise their requests and results."
selection_hint = "Use to list available external Agents, delegate bounded work, supervise their requests, collect results, or manage ACP connections."

[visibility]
default = true

[runtime]
timeout_seconds = 90
parallel_policy = "serial"

[runtime.result]
trace_mode = "foldable"
