name = "subagent.connect"
domain = "subagent"

[tool]
description = "Prepare an ACP session for this Turn; optional cwd_link names an existing daily Workspace directory."

[tool.schema]
type = "object"
required = ["agent_id"]
additionalProperties = false

[tool.schema.properties.agent_id]
type = "string"

[tool.schema.properties.cwd_link]
type = "string"

[semantic]
use_when = ["Prepare an ACP session for this Turn; optional cwd_link names an existing daily Workspace directory."]
effects = ["modifying"]

[execution]
executor = "subagent.connect"
