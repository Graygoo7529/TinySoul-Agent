name = "subagent.disconnect"
domain = "subagent"

[tool]
description = "Disconnect an idle connection; stop its live Job before disconnecting."

[tool.schema]
type = "object"
required = ["connection_id"]
additionalProperties = false

[tool.schema.properties.connection_id]
type = "string"

[semantic]
use_when = [
    "Close an idle external Agent connection after all work is complete",
    "Release resources when no further delegation is needed this Turn",
    "Free a connection after stopping its active Job"
]
avoid_when = [
    "The connection still has a running Job; stop it with core.job.stop first",
    "Planning to delegate more work on the same connection this Turn",
    "Connection will be automatically released when the Turn ends"
]
effects = ["modifying"]
examples = [
    "Disconnect 'coder' connection after completing all delegated analysis",
    "Close the connection after collecting final results and stopping the Job",
    "Release idle connection before answering the user"
]

[execution]
executor = "subagent.disconnect"
