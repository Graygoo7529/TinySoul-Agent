name = "web.discover_pages"
domain = "web"

[tool]
description = "Discover same-origin pages reachable from one public HTTPS seed. Returns bounded URL and deterministic page metadata for deciding which pages to fetch later; it does not save page bodies."

[tool.schema]
type = "object"
required = ["start_url"]
additionalProperties = false

[tool.schema.properties.start_url]
type = "string"
description = "Public HTTPS seed page to inspect."

[tool.schema.properties.max_visit_depth]
type = "integer"
description = "Optional recursive visit depth from zero through the configured project maximum. Zero visits only the seed."

[tool.schema.properties.include_globs]
type = "array"
description = "Optional same-origin URL path globs that candidates must match."
items = { type = "string" }

[tool.schema.properties.exclude_globs]
type = "array"
description = "Optional same-origin URL path globs that candidates must not match."
items = { type = "string" }

[semantic]
use_when = [
    "Discover same-origin pages from known seed URL",
    "Get links and page metadata before deciding which pages to fetch fully",
    "Explore site structure with bounded recursive depth"
]
avoid_when = [
    "Known page should be converted directly; use web.fetch_* actions",
    "Need current Web source discovery; use web.search_by_kimi",
    "Only need single page; use fetch actions directly"
]
effects = ["additive"]
examples = [
    "Discover pages from https://example.com/docs/ with depth 0 (seed only)",
    "Explore documentation structure with max_visit_depth 2",
    "Get bounded page list with include_globs and exclude_globs filters"
]

[runtime]
timeout_seconds = 180
parallel_policy = "serial"

[execution]
executor = "web.discover_pages"
