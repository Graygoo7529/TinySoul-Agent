name = "web.fetch_with_defuddle"
domain = "web"

[tool]
description = "Fetch one public HTTPS page and use the local Defuddle CLI to write readable Markdown to Workspace. The result contains only a bounded excerpt and artifact metadata."

[tool.schema]
type = "object"
required = ["url", "target_ref"]
additionalProperties = false

[tool.schema.properties.url]
type = "string"
description = "Public HTTPS page URL."

[tool.schema.properties.target_ref]
type = "string"
description = "Target Workspace Markdown reference such as workspace:web/pages/article.md."

[tool.schema.properties.overwrite]
type = "boolean"
description = "Whether to replace an existing target. Defaults to false."

[semantic]
use_when = [
    "Fetch clean readable Markdown copy of public Web page using Defuddle",
    "Convert known URL to Workspace Markdown with preferred extractor",
    "Get readable content from public HTTPS page"
]
avoid_when = [
    "Need source discovery rather than reading known URL; use web.search_by_kimi",
    "Defuddle is unavailable; use web.fetch_with_trafilatura",
    "URL is not public HTTPS"
]
effects = ["modifying"]
examples = [
    "Fetch https://example.com/guide to workspace:web/pages/guide.md",
    "Convert official documentation page to Workspace with Defuddle",
    "Get readable Markdown from public Web page with preferred tool"
]

[runtime]
parallel_policy = "serial"

[execution]
executor = "web.fetch_with_defuddle"
