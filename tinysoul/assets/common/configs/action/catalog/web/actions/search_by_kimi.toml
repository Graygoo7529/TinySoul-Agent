name = "web.search_by_kimi"
domain = "web"

[tool]
description = "Search the public Web through the independent Kimi Search provider. Returns both a synthesized answer and structured source results; oversized output is saved to Workspace Markdown."

[tool.schema]
type = "object"
required = ["query"]
additionalProperties = false

[tool.schema.properties.query]
type = "string"
description = "Specific Web search question or query."

[semantic]
use_when = [
    "Need current public information not in Context",
    "Discover web sources and get synthesized answer",
    "Get up-to-date facts, news, or documentation from the Web"
]
avoid_when = [
    "Information is already in Context, Memory, or Home",
    "Have a known URL to fetch; use web.fetch_* actions",
    "Offline task that doesn't require network"
]
effects = ["additive"]
examples = [
    "Search for 'Python 3.13 release date' with answer and sources",
    "Find current best practices for 'React server components'",
    "Discover latest news about 'quantum computing breakthroughs'"
]

[runtime]
timeout_seconds = 600
parallel_policy = "serial"

[execution]
executor = "web.search_by_kimi"
