name = "web.fetch_with_trafilatura"
domain = "web"

[tool]
description = "Fetch one public HTTPS page and use Trafilatura to write readable Markdown to Workspace. Use as the page-extraction fallback when Defuddle is unavailable or unsuitable."

[tool.schema]
type = "object"
required = ["url", "target_ref"]
additionalProperties = false

[tool.schema.properties.url]
type = "string"
description = "Public HTTPS page URL."

[tool.schema.properties.target_ref]
type = "string"
description = "Target Workspace Markdown reference such as workspace:web/pages/article.md."

[tool.schema.properties.overwrite]
type = "boolean"
description = "Whether to replace an existing target. Defaults to false."

[semantic]
use_when = [
    "Fetch a known public web page to readable Workspace Markdown",
    "Defuddle is unavailable or didn't extract successfully",
    "Need fallback extractor for web content"
]
avoid_when = [
    "Should discover sources first; use web.search_by_kimi",
    "Defuddle is preferred and working (use web.fetch_with_defuddle)",
    "URL is not a public HTTPS page"
]
effects = ["modifying"]
examples = [
    "Fetch article from https://example.com/post to workspace:web/article.md",
    "Extract web page when Defuddle is disabled"
]

[runtime]
parallel_policy = "serial"

[execution]
executor = "web.fetch_with_trafilatura"
