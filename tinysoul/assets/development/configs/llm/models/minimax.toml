[llm.models.minimax-latest]
family = "MiniMax"
collapsed = false
adapter = "minimax"
providers = [
  { provider = "orca", provider_model = "minimax/minimax-m3" },
  { provider = "minimax", provider_model = "MiniMax-M3" },
]
context_window_tokens = 262144
capabilities = [
  "text_input",
  "image_input",
  "image_remote_url",
  "tool_calling",
  "reasoning_output",
]

[llm.models.minimax-latest.adapter_options]
native_replay = "content"
thinking = "adaptive"
choices.thinking = ["adaptive", "disabled"]
