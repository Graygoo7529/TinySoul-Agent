[llm.models.claude-sonnet]
family = "Claude"
collapsed = false
adapter = "anthropic-messages"
providers = [
  { provider = "anthropic", provider_model = "claude-sonnet-5-5" },
  { provider = "token-advant", provider_model = "claude-sonnet-5-5" },
]
context_window_tokens = 1000000
capabilities = [
  "text_input",
  "image_input",
  "image_remote_url",
  "json_object_output",
  "tool_calling",
  "reasoning_output",
  "prompt_cache",
]
reasoning_effort = "high"

[llm.models.claude-sonnet.adapter_options]
sampling = "omit"
thinking = "adaptive"
thinking_display = "summarized"
native_replay = "signed"
