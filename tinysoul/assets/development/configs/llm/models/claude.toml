# Optional family: enable a bound provider and select models in a task chain.
# Bindings and supported choices reviewed against official docs on 2026-10-22.

[llm.models.claude-fable]
family = "Claude"
collapsed = false
adapter = "anthropic-messages"
providers = [
  { provider = "anthropic", provider_model = "claude-fable-5-1" },
  { provider = "token-advant", provider_model = "claude-fable-5-1" },
]
context_window_tokens = 1000000
capabilities = [
  "text_input",
  "image_input",
  "image_remote_url",
  "json_object_output",
  "tool_calling",
  "reasoning_output",
  "prompt_cache",
]
reasoning_effort = "high"

[llm.models.claude-fable.adapter_options]
sampling = "omit"
thinking = "adaptive"
thinking_display = "summarized"
native_replay = "signed"
replay_prefix_binding = true
tool_choice_policy = "auto"
prompt_cache_mode = "automatic"
prompt_cache_ttl = "5m"
prompt_cache_boundaries = ["background", "trace"]
choices.sampling = ["omit"]
choices.thinking = ["adaptive"]
choices.thinking_display = ["summarized", "omitted", "updates"]
choices.tool_choice_policy = ["auto"]
choices.reasoning_effort = ["low", "medium", "high", "xhigh", "max"]

