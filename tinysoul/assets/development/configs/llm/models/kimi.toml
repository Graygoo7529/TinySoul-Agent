[llm.models.kimi-coding-latest]
family = "Kimi"
collapsed = false
adapter = "kimi"
providers = [
  { provider = "orca", provider_model = "kimi/kimi-k2.7-code" },
  { provider = "kimi", provider_model = "kimi-k2.7-code-highspeed" },
]
context_window_tokens = 262144
capabilities = [
  "text_input",
  "image_input",
  "json_object_output",
  "tool_calling",
  "reasoning_output",
  "prompt_cache",
]

[llm.models.kimi-coding-latest.adapter_options]
protocol = "k2"
reasoning_keep = "content"
thinking = "enabled"

[llm.models.kimi-coding-latest.request_overrides]
temperature = 1.0

