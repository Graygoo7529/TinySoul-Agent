[workspace]
root = "runtime/workspace"
max_files = 100
max_read_chars = 8192
max_write_chars = 32768
max_image_bytes = 5242880
ignore_dirs = [
  ".agents",
  ".codex",
  ".git",
  ".pytest-local-tmp",
  ".pytest_cache",
  ".test-tmp",
  ".tinysoul",
  "__pycache__",
]

[workspace.watch]
enabled = true
debounce_ms = 200

[workspace.search]
max_query_chars = 256
max_scan_chars = 1048576

[workspace.analysis]
max_intent_chars = 2048
max_reference_refs = 8
max_source_chars = 24576
max_chars_per_reference = 12288
max_answer_chars = 4096
