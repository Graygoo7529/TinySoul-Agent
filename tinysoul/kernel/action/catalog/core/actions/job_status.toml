name = "core.job.status"
domain = "core"

[tool]
description = "Inspect the current Job state, bounded output and candidate summaries."

[tool.schema]
type = "object"
required = ["job_id"]
additionalProperties = false

[tool.schema.properties.job_id]
type = "string"
description = "Job identity returned by a start action in this Turn."

[semantic]
use_when = ["Supervising work already started in this Turn"]
avoid_when = ["No matching Job exists"]
effects = ["read_only"]

[runtime]
timeout_seconds = 10
parallel_policy = "serial"

[backend]
kind = "native"
handler = "core.job.status"
