name = "workspace.convert_with_pypdf"
domain = "workspace"

[tool]
description = "Convert a Workspace PDF to page-oriented Markdown, extracted images and attachments, rendering pages without usable text. The result returns links and execution metadata only."

[tool.schema]
type = "object"
required = ["source_link", "target_link"]
additionalProperties = false

[tool.schema.properties.source_link]
type = "string"
description = "Existing Workspace PDF link."

[tool.schema.properties.target_link]
type = "string"
description = "Target Workspace Markdown link such as workspace:converted/report.md."

[tool.schema.properties.overwrite]
type = "boolean"
description = "Whether to replace the target and its owned asset bundle. Defaults to false."

[tool.schema.properties.expected_source_digest]
type = "string"
description = "Optional source digest guard from Workspace metadata."

[tool.schema.properties.expected_target_digest]
type = "string"
description = "Optional target digest guard used only with overwrite=true."

[semantic]
use_when = ["Need PDF-specific page-level text and visual resource extraction", "Need PDF attachments or image-heavy pages preserved for later inspection"]
avoid_when = ["The source is not PDF", "An ordinary document should use the preferred MarkItDown conversion path"]
effects = ["modifying"]
examples = ["Convert workspace:incoming/scanned.pdf to workspace:converted/scanned.md"]

[runtime]
timeout_seconds = 90
parallel_policy = "serial"

[backend]
kind = "subprocess"
handler = "resource.convert_with_pypdf"
