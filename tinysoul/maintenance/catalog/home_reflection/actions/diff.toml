name = "home_reflection.diff"
domain = "home_reflection"

[tool]
description = "Inspect pending effective Home changes. Omit paths to list Home Links; select paths to inspect bounded baseline and candidate details."
schema = { type = "object", properties = { paths = { type = "array", items = { type = "string" } } }, required = [], additionalProperties = false }

[semantic]
use_when = ["Relevant sources and existing owner content have been inspected"]
effects = ["read_only"]

[runtime]
parallel_policy = "serial"

[runtime.hooks]
normalize = []
execute = []

[backend]
kind = "native"
handler = "home_reflection.diff"
