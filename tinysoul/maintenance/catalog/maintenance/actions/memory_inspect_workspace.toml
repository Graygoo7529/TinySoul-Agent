name = "maintenance.memory.inspect_workspace"
domain = "maintenance"

[tool]
description = "Inspect the bounded read-only Workspace manifest archived for the current Memory Maintenance day."
schema = { type = "object", properties = {}, required = [], additionalProperties = false }

[semantic]
use_when = ["Archived Workspace resources may clarify the Session facts being consolidated"]
avoid_when = ["The current task is Home Maintenance"]
effects = ["read_only"]

[runtime.result]
trace_mode = "foldable"

[backend]
kind = "native"
handler = "maintenance.memory.inspect_workspace"
