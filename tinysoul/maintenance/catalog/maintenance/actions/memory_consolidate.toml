name = "maintenance.memory.consolidate"
domain = "maintenance"

[tool]
description = "Consolidate the current closed-day Session facts into that day's long-term Memory document."
schema = { type = "object", properties = {}, required = [], additionalProperties = false }

[semantic]
use_when = ["The current Memory Maintenance sources have been inspected and are ready to commit"]
avoid_when = ["The current task is Home Maintenance or consolidation already ran"]
effects = ["modifying"]

[runtime]
timeout_seconds = 180
parallel_policy = "serial"

[backend]
kind = "native"
handler = "maintenance.memory.consolidate"
