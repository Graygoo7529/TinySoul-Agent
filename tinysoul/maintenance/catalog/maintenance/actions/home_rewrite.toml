name = "maintenance.home.rewrite"
domain = "maintenance"

[tool]
description = "Resolve one inspected Home change or skill review by writing replacement text to actual Home."

[tool.schema]
type = "object"
required = ["token", "text"]
additionalProperties = false

[tool.schema.properties.token]
type = "string"
description = "Current review token returned by maintenance.home.list."

[tool.schema.properties.text]
type = "string"
description = "Complete replacement text accepted into actual Home."

[semantic]
use_when = ["A runtime change needs curation or skill memory indicates the actual skill should change"]
avoid_when = ["The review has not been inspected or actual Home should remain unchanged"]
effects = ["modifying"]

[backend]
kind = "native"
handler = "maintenance.home.rewrite"
