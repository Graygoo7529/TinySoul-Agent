name = "maintenance.memory.stage_create"
domain = "maintenance"
[tool]
description = "Stage one new entity, concept, atomic fact, or Luhmann note after a relevant query inspection. Fact/note cites are generated by Memory."
schema = { type = "object", properties = { kind = { type = "string", enum = ["entity", "concept", "fact", "note"] }, inspection_ref = { type = "string" }, cite = { type = "string" }, summary = { type = "string" }, title = { type = "string" }, content = { type = "string" }, confidence = { type = "string", enum = ["low", "medium", "high"] }, relations = { type = "array", items = { type = "string" } }, evidence = { type = "array", items = { type = "string" } } }, required = ["kind", "inspection_ref", "content"], additionalProperties = false }
[semantic]
use_when = ["No inspected existing memory expresses the same identity, proposition, or note topic"]
avoid_when = ["An existing memory can be rewritten, merged, or linked"]
effects = ["modifying"]
[runtime]
parallel_policy = "serial"
[runtime.hooks]
normalize = []
execute = []
[backend]
kind = "native"
handler = "maintenance.memory.stage_create"
