name = "maintenance.memory.commit"
domain = "maintenance"
[tool]
description = "Atomically commit the latest validated Memory draft by preview revision."
schema = { type = "object", properties = { preview_revision = { type = "integer", minimum = 0 } }, required = ["preview_revision"], additionalProperties = false }
[semantic]
use_when = ["Preview has succeeded and no later stage action changed the draft"]
avoid_when = ["The preview revision is stale or missing"]
effects = ["modifying"]
[runtime]
parallel_policy = "serial"
[runtime.hooks]
normalize = []
execute = []
[backend]
kind = "native"
handler = "maintenance.memory.commit"
