name = "maintenance.memory.inspect_facts"
domain = "maintenance"

[tool]
description = "Read one bounded page of stable Session facts for the current Memory Maintenance day."

[tool.schema]
type = "object"
required = []
additionalProperties = false

[tool.schema.properties.offset]
type = "integer"
description = "Zero-based fact offset."
minimum = 0
default = 0

[tool.schema.properties.limit]
type = "integer"
description = "Maximum facts to return."
minimum = 1
maximum = 32
default = 8

[semantic]
use_when = ["The Memory source facts must be inspected before consolidation"]
avoid_when = ["The current task is Home Maintenance"]
effects = ["read_only"]

[runtime.result]
trace_mode = "foldable"

[backend]
kind = "native"
handler = "maintenance.memory.inspect_facts"
