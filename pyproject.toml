[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinysoul"
version = "0.1.0"
description = "A local provider-neutral LLM agent runtime"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "markitdown[pdf,docx]",
    "openai>=1.0",
    "Pillow",
    "pypdf",
    "pypdfium2",
    "PyYAML>=6.0",
    "trafilatura>=2.0",
]

[project.scripts]
tinysoul = "tinysoul.app.cli:main"

[project.optional-dependencies]
dev = [
    "crawlee>=1.8,<2",
    "pytest",
]
web-crawl = [
    "crawlee>=1.8,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tinysoul*"]

[tool.setuptools.package-data]
"tinysoul.action" = [
    "catalog/*/*.toml",
    "catalog/*/actions/*.toml",
]
"tinysoul.assets" = [
    "project/*",
    "project/.env.example",
    "project/.gitignore",
    "project/configs/*.toml",
    "project/configs/llm.models/*.toml",
    "project/home/agent/*.md",
    "project/home/agent/*/*.md",
    "project/home/how/*/*.md",
    "project/home/how/*/references/*.md",
    "project/home/how/*/scripts/*.py",
    "project/home/how_domain/*.md",
    "project/home/what/*/*.md",
    "project/home/why/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.environment]
# Keep machine-specific Python paths out of shared config.
# Use scripts/typecheck.ps1 with TINYSOUL_PYTHON, or pass ty --python manually.
root = ["."]
